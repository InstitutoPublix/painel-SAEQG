      {
            "numero": 2,
            "titulo": "Prazo de execução e porte da obra",
            "chamada": "Prazo de referência de 36 meses, acompanhamento ativo da execução e registro dos marcos.",
            "icone": "relogio",
            "cor": "40 82% 50%",
            "fonte": "Seção 5.2 do Relatório Final do Estudo da Qualidade do Gasto",
            "status": "nao_iniciada",
            "paragrafos": [
                  "Análise: A hipótese intuitiva de que obras maiores demoram mais não se sustenta nos dados das 52 obras encerradas. A correlação de Spearman entre a duração total, da assinatura do convênio à finalização, e a área do projeto é de apenas +0,32 (uma relação fraca). A correlação de Spearman é uma medida estatística que varia de -1 a +1 e indica se duas variáveis se movem juntas pela ordem de seus postos: valores próximos de +1 significam que, quanto maior uma, maior a outra; próximos de 0 indicam ausência de relação; e negativos indicam relação inversa. O +0,32 obtido, portanto, diz que área e prazo crescem juntos apenas de forma tênue, longe de uma relação de causa direta. Com o valor executado a associação é ainda menor, +0,22. O tempo mediano de implantação é de 40,7 meses (cerca de 3,4 anos), mas a dispersão é ampla, de 17 a 72 meses, e mal explicada pelo porte. Os casos demonstram isso com clareza: Cianorte entregou o maior parque do projeto, 157.858 m², em 38 meses, e Andirá entregou 68.084 m² em apenas 24 meses; Campo Mourão executou 92.072 m² em 33 meses e Jussara 88.185 m² em 31 meses. No sentido oposto, as obras mais lentas são de porte médio, como Formosa do Oeste (72 meses para 34.253 m²), Nova Londrina (71 meses para 40.000 m²) e Pitanga (62 meses para apenas 24.800 m²). Doze obras foram simultaneamente grandes, acima da mediana de área, e rápidas, abaixo da mediana de prazo, o que descarta o tamanho como gargalo. Se não é o porte, o fator explicativo parece apontar para a capacidade de execução do município, condução da licitação, fiscalização e fluxo de repasse. Um sinal complementar reforça a hipótese: as duas obras de maior contrapartida municipal, Pitanga (62 meses) e Umuarama (60 meses), com 31,5% e 27,1% contra um piso de 2%, estão também entre as mais lentas do projeto, sugerindo que arranjos de cofinanciamento mais pesados podem se associar a obras mais complexas ou de execução mais arrastada. Vale aqui a mesma ressalva da análise anterior: estes 52 encerrados concentram-se no ciclo de 2019, e a leitura de que a gestão local, e não o porte, governa o prazo é, por ora, uma tendência consistente, mas não um veredito; só poderá ser confirmada à medida que as obras dos cortes seguintes encerrarem e ampliarem a base de comparação.",
                  "A base registra, para cada convênio, três datas: a de assinatura, a de início da obra e a de finalização. A partir delas, o prazo total, da assinatura à finalização, separa-se em duas fases. A primeira, da assinatura ao início da obra, compreende a preparação do projeto executivo, a licitação e a contratação; tem mediana de 5,4 meses e varia de 0,9 a 11,9 meses, sem nenhum caso superior a um ano. A segunda, do início à finalização, corresponde à execução física da obra; tem mediana de 33,8 meses e varia de 15,7 a 68,6 meses. Em cada obra, a fase que antecede o início físico representa, na mediana, cerca de 13% do prazo total, cabendo os aproximadamente 87% restantes à execução da obra propriamente dita. Praticamente toda a dispersão observada no prazo total origina-se, portanto, na fase de execução. As seis obras que superaram 60 meses ilustram o ponto: sua fase preparatória durou entre 2,1 e 11,9 meses, dentro da faixa geral do projeto, enquanto a execução física consumiu entre 53,9 e 68,6 meses. Cabe a ressalva de que a base registra apenas essas três datas, de modo que eventuais tratativas anteriores à celebração do convênio não são capturadas. Ainda assim, o registro disponível indica que o esforço de fortalecimento da gestão municipal tende a produzir maior efeito quando dirigido à condução da obra já contratada.",
                  "Recomendação: Estabelecer um prazo de referência de implantação independente do porte da obra, por exemplo 36 meses da assinatura à entrega, contra a mediana atual de 40,7 meses, e direcionar acompanhamento técnico ativo à fase de execução das obras, em vez de presumir que parques grandes serão lentos. Investigar individualmente as obras acima de 60 meses, Formosa do Oeste, Nova Londrina, Nova Olímpia, Boa Ventura de São Roque, Pitanga e Umuarama, para identificar os gargalos recorrentes e checar a relação entre contrapartida elevada e maior prazo.",
                  "Como o prazo é governado pela capacidade de gestão municipal, a referência de 36 meses precisa vir acompanhada de medidas que atuem sobre essa capacidade, sob pena de converter-se em exigência sem a devida contrapartida de apoio. O desenho dessas medidas deve considerar uma característica estrutural do portfólio: dos 87 municípios atendidos, 83 celebraram um único convênio e apenas quatro celebraram dois, de modo que praticamente todo município é estreante no projeto e não há aprendizado acumulado localmente a ser aproveitado. Como a dispersão de prazo se concentra na fase de execução física, recomendam-se três medidas dirigidas a essa fase. A primeira, de maior efeito esperado, é o apoio à fiscalização e à gestão contratual da obra, com rotina de medição periódica, designação formal de responsável pelo acompanhamento no município e agenda regular de acompanhamento técnico do IAT, presencial ou remoto. A segunda é o registro, na base do projeto, dos marcos intermediários da execução, como publicação do edital, homologação, ordem de serviço, medições e eventuais paralisações com o respectivo motivo, informação hoje ausente e sem a qual o gargalo específico de cada obra não pode ser localizado com precisão. A terceira é a calibragem da intensidade do acompanhamento por fatores objetivos de risco da obra, e não pelo histórico do município, uma vez que a ausência de histórico é a regra no projeto e não distingue casos.",
                  "Resultado esperado: Redução da amplitude de prazos, hoje de 17 a 72 meses, e da mediana de 40,7 meses, com foco na capacidade de gestão municipal e não em restrição ao porte. Prazo estimado: 2 a 4 anos, ao acompanhamento das obras dos cortes 2024 e 2025. Das 52 obras concluídas, 62% superaram 36 meses e 6 ultrapassaram 60 meses; adotar a referência de 36 meses, ante a mediana atual de 40,7, anteciparia em cerca de cinco meses a entrega de cada parque à população, ampliando o resultado gerado com os mesmos recursos. O efeito das medidas de fortalecimento da gestão municipal tende a se concentrar na fase de execução física, que responde pela maior parte do prazo e por praticamente toda a sua dispersão, e sua aferição dependerá do registro dos marcos intermediários ora recomendado."
            ],

      {
            "numero": 3,
            "titulo": "Evolução da cobertura florestal no antes e depois das obras",
            "chamada": "Coleta de dados primários no parque e confirmação da atribuição do ganho ambiental à obra.",
            "icone": "folha",
            "cor": "147 67% 37%",
            "fonte": "Seção 5.3 do Relatório Final do Estudo da Qualidade do Gasto",
            "status": "nao_iniciada",
            "paragrafos": [
                  "Análise: Entre os sete indicadores de resultado acompanhados, o que combina a maior cobertura de obras com janela antes-e-depois e um sinal interpretável é o Remanescente Florestal (%), que é também o indicador tematicamente mais alinhado ao projeto, dado que os convênios exigem plantio de vegetação nativa da Mata Atlântica. Ele dispõe de medição pré e pós-obra para 28 municípios com obra encerrada (os demais não têm pontos suficientes antes ou depois). Em 22 desses 28 municípios (79%), o remanescente florestal subiu após a obra, com variação mediana de +0,15 ponto percentual. Os ganhos são modestos em magnitude, os maiores são Guaíra (+0,67 p.p.), Rondon (+0,54 p.p.) e Jussara (+0,44 p.p.), com Santa Isabel do Ivaí (+0,36 p.p.) também entre os avanços, enquanto uma minoria registrou queda, como Ventania (-0,56 p.p.) e Sapopema (-0,34 p.p.). Um ponto importante para não repetir o erro de atrelar resultado a tamanho: a melhora florestal não está fortemente associada nem à área nem ao custo da obra, com correlações de Spearman fracas (+0,16 com a área e -0,20 com o custo por m²); ou seja, os grandes parques baratos por m² não entregaram sistematicamente mais ganho florestal que os pequenos. O percentual de remanescente é uma medida municipal apenas indicativa para captar um parque de poucos hectares (problema de atribuição), a série é bienal, as variações são pequenas e parte do movimento pode refletir dinâmicas regionais de uso do solo alheias ao parque. Assim, a melhora direcional em 79% dos municípios é um sinal encorajador, não uma prova de efeito causal, e tende a se firmar à medida que mais obras encerrarem e as janelas pós-obra se alongarem.",
                  "Recomendação: Investigar por que justamente o remanescente florestal melhora enquanto os demais indicadores não acusam ganho, distinguindo duas hipóteses concorrentes: ou o efeito do parque se manifesta de fato primeiro na cobertura vegetal, coerente com a exigência de plantio de nativas, ou os outros indicadores apenas não dispõem de dado com densidade e sensibilidade suficientes para captar mudança (caso de alagamento, com ocorrências quase sempre nulas, e de cursos d'água com parques lineares, praticamente sem série). Em paralelo, confirmar se a alta de remanescente é atribuível ao parque ou à tendência regional de uso do solo, comparando cada município com seus vizinhos não atendidos. Sobretudo, instituir a coleta de dados primários, locais ao parque e hoje ausentes, área efetivamente plantada, número de mudas e taxa de sobrevivência, área recuperada e permeável, que são formas de medir a melhora com mais precisão, em vez de depender de proxies municipais.",
                  "Resultado esperado: Compreensão do mecanismo por trás da melhora florestal e diagnóstico claro de quais indicadores realmente estagnaram e quais apenas carecem de dados, sustentado por informação primária coletada em campo. Prazo estimado: 2 a 3 anos para o diagnóstico e a estruturação da coleta primária; 4 a 6 anos para a leitura de impacto consolidada."
            ],

      {
            "numero": 4,
            "titulo": "Otimização dos recursos",
            "chamada": "Gatilhos objetivos de seleção e acompanhamento, com faixas de custo de referência por porte.",
            "icone": "alvo",
            "cor": "194 85% 38%",
            "fonte": "Seção 5.4 do Relatório Final do Estudo da Qualidade do Gasto",
            "status": "nao_iniciada",
            "paragrafos": [
                  "As recomendações das seções 5.1 a 5.3 já constituem, por si, critérios de otimização dos recursos do projeto: sua adoção eleva o resultado obtido por real investido sem exigir ampliação da dotação. Mais do que diagnósticos, esses achados podem ser convertidos em gatilhos objetivos de seleção e de acompanhamento, aplicados na entrada do convênio e ao longo da execução.",
                  "Da análise de dispersão do custo construtivo (5.1) deriva-se um custo por metro quadrado de referência, definido por faixa de porte da obra, a operar como gatilho de seleção. Projetos cujo custo unitário se situe dentro da faixa de referência de sua classe de área seriam aceitos diretamente; os que a excedam exigiriam justificativa técnica que demonstre a necessidade de maior investimento, como condições do terreno, fundação, drenagem ou contenção. O custo deixa, assim, de ser apenas descritivo e passa a orientar a decisão, sem penalizar obras de maior complexidade desde que tecnicamente justificadas. Para viabilizar a aplicação imediata do critério, propõem-se faixas iniciais de custo por metro quadrado de referência, calculadas a partir das 52 obras encerradas com área e valor registrados e organizadas em quatro classes de porte, conforme o Quadro 2. Em cada classe, adota-se a mediana observada como custo de referência e o terceiro quartil como teto de referência, acima do qual se aplica a exigência de justificativa técnica já descrita. As faixas confirmam a relação identificada na seção 5.1, de que o custo por metro quadrado cai acentuadamente à medida que a área cresce, uma vez que o custo de implantar um parque é relativamente fixo, com investimento mediano em torno de R$ 1,0 milhão por obra, e se dilui em maior área nos parques mais extensos.",
                  "Esses parâmetros constituem proposta inicial, e não valores definitivos. Derivam de amostra pequena e concentrada no primeiro ciclo do projeto, com 28 das 52 obras encerradas conveniadas em 2019, e são especialmente frágeis na classe de maior porte, que reúne apenas seis obras, e na de menor porte, a mais dispersa, em que o custo por metro quadrado varia de R$ 60 a R$ 1.126. Tanto o recorte das faixas de porte quanto a adoção do terceiro quartil como teto de referência resultam da distribuição dos dados hoje disponíveis e podem ser ajustados pelas partes interessadas, SEDEST, IAT e SEFA, caso considerem pertinente adotar recorte ou limiar diverso. Recomenda-se que as faixas sejam recalibradas a cada ciclo orçamentário, à medida que as obras dos cortes de 2024 e 2025 encerrarem e ampliarem a base de comparação. A definição e a atualização periódica dos parâmetros caberiam à SEDEST, no plano da política, e ao IAT, no plano técnico, que dispõem, na aba Eficiência do Investimento do painel, do cálculo automatizado dessas estatísticas por faixa de porte. Consolidados em uma planilha orçamentária referencial padronizada, disponibilizada pelo Estado ao município aderente, os valores tornam-se um parâmetro vivo, atualizado com o próprio avanço do projeto, e não uma referência estática. Essa planilha integra um conjunto padronizado de instrumentos de apoio, como estrutura de termo de referência, modelo de edital e catálogo de especificações técnicas, entendido como base comum de referência, e não como projeto único, e cuja adoção consta do quadro de governança.",
                  "Da análise de prazo de execução (5.2) deriva-se um prazo máximo de referência de 36 meses, da assinatura à entrega, como gatilho de acompanhamento. Seu cumprimento seria exigência padrão do convênio, e prazos superiores demandariam justificativa técnica e acompanhamento ativo. A medida ataca diretamente a dispersão observada, de mediana de 40,7 meses, com 62% das obras encerradas acima de 36 meses, e reduz o tempo de imobilização de recursos já empenhados.",
                  "Da análise dos indicadores de resultado (5.3) deriva-se menos um gatilho de entrada e mais a necessidade de aprimorar a medição dos resultados do projeto. A análise evidenciou que os indicadores municipais hoje disponíveis não captam com precisão o efeito de um parque e recomendou instituir a coleta de dados primários, locais a cada obra, como área efetivamente plantada, número de mudas, taxa de sobrevivência e área recuperada e permeável. Estruturada essa coleta, torna-se possível avaliar periodicamente, e não uma única vez, se o projeto está de fato colaborando com a melhora da sustentabilidade que se propõe a atingir, distinguindo os arranjos que entregam resultado ambiental efetivo daqueles que não o fazem.",
                  "Em conjunto, esses critérios atuam em três momentos do ciclo da obra. Na seleção, anterior à celebração, o custo por metro quadrado de referência tria e disciplina a aceitação dos convênios. Durante o acompanhamento, o prazo máximo de 36 meses e o monitoramento ativo orientam a execução. Após a obra, a avaliação de resultado, sustentada pelos dados primários coletados, afere a eficácia e orienta a calibragem dos parâmetros nos ciclos seguintes, em coerência com o caráter contínuo do Orçamento para Resultados.",
                  "Esses três critérios não substituem, mas reforçam, os parâmetros que o projeto já adota. O critério de seleção por custo por metro quadrado somar-se-ia aos critérios de elegibilidade hoje vigentes, predominantemente técnicos, jurídicos e ambientais, como a titularidade do terreno, a apresentação de projeto com Anotação de Responsabilidade Técnica, a localização em área degradada de fundo de vale e o plantio mínimo de vegetação nativa da Mata Atlântica, bem como ao critério de desempate que hoje favorece os municípios de menor IDH-PNUD, acrescentando-lhes uma dimensão de eficiência econômica de que a seleção ainda não dispõe.",
                  "O critério de prazo máximo de 36 meses reforçaria o acompanhamento que o projeto já exerce por meio do cronograma físico-financeiro e da liberação de repasses conforme a progressão da obra, ao oferecer um parâmetro objetivo de tempo.",

   2b. MODELO DO PROGRAMA: ORGAOS, PILOTOS E RECOMENDACOES
   A base vem dos relatorios, em PERFIS e em CONTEUDO, e nunca e
   alterada. Por cima dela entra a configuracao mantida pela
   coordenacao da SEFA. Enquanto o backend nao existe ela fica no

/* Prefixo das chaves guardadas no navegador. Era sarp. ate o sistema mudar
   de nome; migraPrefixo copia o que estava na chave antiga na primeira carga
   e apaga a antiga, para nada do que ja foi registrado se perder. Some
   quando o backend entrar.
   Versao final (nov/2026): o prefixo passou de saeqg. para saeqgf. A
   primeira carga copia da chave anterior todo o conteudo (configuracao,
   cadastros, acoes criadas, edicoes estruturais, prazos pactuados e marcas
   de renumeracao) e deixa de fora os lancamentos de atualizacao das acoes:
   situacao, progresso, justificativa, evidencias e historico. A versao final
   comeca sem nenhum lancamento, e a versao anterior continua lendo a chave
   antiga, intocada (migraVersaoFinal, logo abaixo).                        */
const PRE = 'saeqgf.';
const PRE_ANTERIOR = 'saeqg.';
(function migraPrefixo(){
  [localStorage, sessionStorage].forEach(loja => {
    try{
      Object.keys(loja).filter(k => k.indexOf('sarp.') === 0).forEach(k => {
        const nova = PRE + k.slice(5);
        if(loja.getItem(nova) === null) loja.setItem(nova, loja.getItem(k));
        loja.removeItem(k);
      });
    }catch(e){}
  });
})();

/* Copia da versao anterior, uma unica vez, sem os lancamentos de atualizacao.
   No registro de cada acao ficam o prazo pactuado e, quando a acao nunca foi
   atualizada pela secretaria, os campos da ficha que a coordenacao mudou
   (o que difere do relatorio). Quando ja houve atualizacao, os demais campos
   eram copias da ficha feitas ao salvar e ficam de fora, para valer o texto
   vigente. Os registros guardados por renumeracao (retiradas) tambem ficam. */
(function migraVersaoFinal(){
  try{
    if(localStorage.getItem(PRE + 'migrado') !== null) return;
    const FICHA = ['titulo', 'descricao', 'responsavel', 'area', 'pessoa', 'produto', 'resultado'];
    const base = (org, pil, cod) => {
      let a = null;
      if(pil === 'p1' && CONTEUDO[org])
        CONTEUDO[org].recomendacoes.forEach(r => (r.acoes || []).forEach(x => { if(x.codigo === cod) a = x; }));
      if(!a) try{
        (JSON.parse(localStorage.getItem(PRE_ANTERIOR + 'novas.' + org + '.' + pil)) || [])
          .forEach(x => { if(x.codigo === cod) a = x; });
      }catch(e){}
      return a || {};
    };
    Object.keys(localStorage).filter(k => k.indexOf(PRE_ANTERIOR) === 0).forEach(k => {
      const resto = k.slice(PRE_ANTERIOR.length);
      if(/^retiradas\.(?!cfg\.)/.test(resto)) return;
      let v = localStorage.getItem(k);
      const m = resto.match(/^acoes\.([^.]+)(?:\.(.+))?$/);
      if(m){
        const est = JSON.parse(v) || {}, limpo = {}, pil = m[2] || 'p1';
        Object.keys(est).forEach(cod => {
          const e = est[cod] || {}, b = base(m[1], pil, cod), f = {};
          if(e.prazo) f.prazo = e.prazo;
          if(!(e.historico || []).length)
            FICHA.forEach(c => { if(e[c] != null && String(e[c]) !== String(b[c] || '')) f[c] = e[c]; });
          if(Object.keys(f).length) limpo[cod] = f;
        });
        v = JSON.stringify(limpo);
      }
      if(localStorage.getItem(PRE + resto) === null) localStorage.setItem(PRE + resto, v);
    });
    localStorage.setItem(PRE + 'migrado', new Date().toISOString());
  }catch(e){}
})();

function aplicaTexto(t){
  if(TEXTOS.indexOf(t) < 0) t = 'padrao';
  if(t === 'padrao') document.documentElement.removeAttribute('data-texto');
  else document.documentElement.setAttribute('data-texto', t);
  document.querySelectorAll('.tb-texto [data-texto]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.texto === t)));
  const c = document.getElementById('btn-texto-ciclo');
  if(c) c.title = 'Tamanho do texto: ' + NOME_TEXTO[t];
  return t;
}

/* Escreve uma entrada de um ramo da configuracao sem tocar nas demais.
   Passar null como dados remove a entrada.                              */
function mudaConfig(ramo, chave, dados){
  const c = leConfig();
  c[ramo] = Object.assign({}, c[ramo]);
  if(dados === null) delete c[ramo][chave];
  else c[ramo][chave] = Object.assign({}, c[ramo][chave], dados);
  salvaConfig(c);
}

/* ---- cadastros de acesso -----------------------------------------------
   Usuarios cadastrados pela coordenacao em Configuracoes > Cadastros, na
   chave saeqg.usuarios (com backend: GET e PUT /usuarios, so para gestor).
   Cada um tem e-mail (o login), senha guardada so como resumo SHA-256 com
   sal, e nivel: 'gestor' entra pela coordenacao (SEFA) e ve tudo;
   'restrito' entra so nas secretarias e nos estudos de acessos, no formato
   { orgao: [ids dos estudos] }. Enquanto nao houver nenhum cadastro, o
   acesso nao confere credencial, para a coordenacao poder cadastrar o
   primeiro gestor.                                                       */
function sha256(texto){
  const rot = (v, n) => (v >>> n) | (v << (32 - n));
  const MAX = Math.pow(2, 32);
  if(!sha256.k){
    sha256.h = []; sha256.k = [];
    const composto = {};
    for(let c = 2, n = 0; n < 64; c++){
      if(composto[c]) continue;
      for(let i = 0; i < 313; i += c) composto[i] = c;
      sha256.h[n] = (Math.pow(c, .5) * MAX) | 0;
      sha256.k[n++] = (Math.pow(c, 1 / 3) * MAX) | 0;
    }
  }
  let s = unescape(encodeURIComponent(texto));
  const bits = s.length * 8, w = [];
  s += '\x80';
  while(s.length % 64 - 56) s += '\x00';
  for(let i = 0; i < s.length; i++) w[i >> 2] |= s.charCodeAt(i) << ((3 - i) % 4) * 8;
  w[w.length] = (bits / MAX) | 0;
  w[w.length] = bits;
  let h = sha256.h.slice(0, 8);
  for(let j = 0; j < w.length; ){
    const m = w.slice(j, j += 16), antes = h;
    h = h.slice(0, 8);
    for(let i = 0; i < 64; i++){
      const a = h[0], e = h[4], m15 = m[i - 15], m2 = m[i - 2];
      const t1 = h[7] + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & h[5]) ^ (~e & h[6])) + sha256.k[i] +
        (m[i] = i < 16 ? m[i] : (m[i - 16] + (rot(m15, 7) ^ rot(m15, 18) ^ (m15 >>> 3)) + m[i - 7] +
                                 (rot(m2, 17) ^ rot(m2, 19) ^ (m2 >>> 10))) | 0);
      const t2 = (rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
      h = [(t1 + t2) | 0].concat(h);
      h[4] = (h[4] + t1) | 0;
    }
    for(let i = 0; i < 8; i++) h[i] = (h[i] + antes[i]) | 0;
  }
  let out = '';
  for(let i = 0; i < 8; i++)
    for(let j = 3; j >= 0; j--){ const b = (h[i] >> (j * 8)) & 255; out += (b < 16 ? '0' : '') + b.toString(16); }
  return out;
}
function leUsuarios(){
  try{ return JSON.parse(localStorage.getItem(PRE + 'usuarios')) || []; }catch(e){ return []; }
}
function salvaUsuarios(us){
  try{ localStorage.setItem(PRE + 'usuarios', JSON.stringify(us)); }catch(e){}
}
const normEmail     = v => String(v || '').trim().toLowerCase();
const usuarioPorEmail = email => leUsuarios().filter(u => u.email === normEmail(email))[0] || null;
const temCadastro   = () => leUsuarios().length > 0;
const resumoSenha   = (sal, senha) => sha256(sal + '|' + senha);
const emailValido   = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim());
/* Regra da senha: ao menos 6 caracteres, uma letra maiuscula e um caractere
   especial (o que nao e letra, numero nem espaco). Devolve o que falta.  */
const REGRA_SENHA = 'Mínimo de 6 caracteres, com ao menos uma letra maiúscula e um caractere especial';
function faltaNaSenha(s){
  const falta = [];
  if(String(s).length < 6)        falta.push('ao menos 6 caracteres');
  if(!/\p{Lu}/u.test(s))          falta.push('uma letra maiúscula');
  if(!/[^\p{L}\p{N}\s]/u.test(s)) falta.push('um caractere especial (como ! @ # $ % *)');
  return falta.length ? 'A senha precisa ter ' + falta.join(', ').replace(/, ([^,]*)$/, ' e $1') + '.' : '';
}
/* Estudos que o usuario restrito ve num orgao: os da lista que ainda existem. */
const estudosPermitidos = (u, orgaoId) =>
  ((u && u.acessos && u.acessos[orgaoId]) || []).filter(id => pilotoPorId(orgaoId, id));

/* Sigla ou id do orgao, sem diferenca de maiusculas nem de pontuacao. */
const soLetras = v => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const ehSigla  = (v, o) => !!o && !!soLetras(v) && [soLetras(o.sigla), soLetras(o.id)].indexOf(soLetras(v)) >= 0;

/* Conferencia local do acesso, no lugar do servidor enquanto ele nao existe.
   Devolve a mesma forma que o POST /auth/login devolvera.                 */
function autenticaLocal(orgao, email, senha){
  if(!String(email || '').trim()) return { ok:false, erro:'Informe o login.' };
  if(!senha)                      return { ok:false, erro:'Informe a senha.' };
  /* Versao piloto: o acesso de cada orgao e pela sigla, como login e como
     senha (sesa e sesa; der ou der/pr; sefa e sefa para a coordenacao).
     Fora isso, so entra quem estiver em Cadastros. Sai quando o servidor entrar. */
  const o = orgaoPorId(orgao);
  if(ehSigla(email, o) && ehSigla(senha, o))
    return { ok:true, perfil:orgao, usuario:{ email:o.sigla, nivel:null, sigla:true } };
  if(!temCadastro()) return { ok:false, erro:'Login ou senha inválidos.' };
  const u = usuarioPorEmail(email);
  if(!u || u.senha !== resumoSenha(u.sal, senha)) return { ok:false, erro:'Login ou senha inválidos.' };
  const sefa = (orgaoPorId(orgao) || {}).tipo === 'sefa';
  if(sefa && u.nivel !== 'gestor')
    return { ok:false, erro:'Este usuário não tem acesso à coordenação.' };
  if(!sefa && u.nivel === 'gestor')
    return { ok:false, erro:'Usuário gestor entra pela coordenação (SEFA).' };
  if(!sefa && !estudosPermitidos(u, orgao).length)
    return { ok:false, erro:'Este usuário não tem acesso a este órgão.' };
  return { ok:true, perfil:orgao, usuario:{ email:u.email, nivel:u.nivel } };
}

/* ---- ciclo de vida dos cadastros ----------------------------------------
   Secretaria, estudo e recomendacao podem ser excluidos: o item some de
   todas as telas e vai para a aba Apagados de Configuracoes (campo apagado),
   de onde volta com Restaurar. Apagar definitivamente marca removido no que
   veio do relatorio, que esta no codigo, e tira da configuracao o que foi
   cadastrado aqui; em ambos os casos o registro da secretaria e apagado.
   O estudo tem ainda dois estados proprios: fora do ar (oculto, em
   preparacao, a secretaria ve "em construcao") e arquivado (encerrado: sai
   do acompanhamento e fica so para consulta).
   O oculto antigo de secretaria e de recomendacao era a exclusao do sistema,
   por isso passa a ser lido como apagado.                                  */
const comoApagado = x => { x.apagado = !!(x.apagado || x.oculto); delete x.oculto; return x; };

/* ---- orgaos -----------------------------------------------------------
   A coordenacao pode renomear, excluir e acrescentar orgaos. orgaosTodos
   inclui os que estao em Apagados; orgaos so os que estao em uso.        */
function orgaosTodos(){
  const c = leConfig().orgaos || {};
  const daBase = PERFIS.map(p => comoApagado(Object.assign({}, p, c[p.id] || {}, { id:p.id })));
  const criados = Object.keys(c)
    .filter(id => !PERFIS.some(p => p.id === id))
    .map(id => comoApagado(Object.assign({ tipo:'orgao', criado:true }, c[id], { id:id })));
  return daBase.concat(criados).filter(o => !o.removido);
}
function orgaos(){
  return orgaosTodos().filter(o => !o.apagado);
}
const orgaoPorId = id => orgaosTodos().filter(p => p.id === id)[0] || null;

/* ---- pilotos (Estudos da Qualidade do Gasto) ---------------------------
   Na interface o termo e "Estudo da Qualidade do Gasto". No codigo ficou o
   nome curto piloto nos identificadores, que nao aparecem em tela.
   Cada orgao trazia um unico estudo, o do relatorio, que aqui recebe o id
   p1. A coordenacao pode renomear, tirar do ar, arquivar, excluir e
   cadastrar outros no mesmo orgao, e a secretaria escolhe qual esta
   observando. pilotosTodos inclui os apagados; pilotos(o, true) inclui os
   fora do ar; pilotos(o) e o que a secretaria ve. Arquivado entra nos dois,
   porque continua disponivel para consulta.                              */
function pilotosTodos(orgaoId){
  const c = (leConfig().pilotos || {})[orgaoId] || {};
  /* O recorte da instalacao e so a semente: o estudo do relatorio nasce
     oculto nesses orgaos, e a coordenacao libera ou volta a ocultar em
     Configuracoes.                                                       */
  const doRelatorio = CONTEUDO[orgaoId]
    ? [Object.assign({ nome: CONTEUDO[orgaoId].piloto.programa, doRelatorio:true,
                       oculto: foraDoAr(orgaoId),
                       rotuloBloco: CONTEUDO[orgaoId].rotuloBloco,
                       rotuloPlural: CONTEUDO[orgaoId].rotuloPlural },
        CONTEUDO[orgaoId].piloto, c.p1 || {}, { id:'p1' })]
    : [];
  const criados = Object.keys(c).filter(k => k !== 'p1')
    .map(k => Object.assign({ resumo:[], criado:true }, c[k], { id:k }));
  return doRelatorio.concat(criados).filter(p => !p.removido);
}
function pilotos(orgaoId, comOcultos){
  let vivos = pilotosTodos(orgaoId).filter(p => !p.apagado);
  /* Usuario restrito ve so os estudos liberados no cadastro dele. */
  const u = state.usuario && state.usuario.nivel === 'restrito' && usuarioPorEmail(state.usuario.email);
  if(u) vivos = vivos.filter(p => ((u.acessos || {})[orgaoId] || []).indexOf(p.id) >= 0);
  return comOcultos ? vivos : vivos.filter(p => !p.oculto);
}
const pilotoPorId = (o, p) => pilotosTodos(o).filter(x => x.id === p)[0] || null;

/* ---- recomendacoes ----------------------------------------------------
   Camada por piloto, na chave "orgao|piloto": sobreposicoes das que vieram
   do relatorio e as que a coordenacao cadastrar. recomendacoesTodas inclui
   as que estao em Apagados. Cada recomendacao leva o orgao e o estudo de
   onde veio (_org e _pil), para as acoes dela serem lidas no lugar certo
   mesmo quando quem le e a coordenacao. Recomendacao arquivada (campo
   arquivado) continua na lista: quem a exibe decide como.               */
const chaveRec = (o, p) => o + '|' + p;
function recomendacoesTodas(orgaoId, pilotoId){
  const c = (leConfig().recomendacoes || {})[chaveRec(orgaoId, pilotoId)] || {};
  const origem = { _org:orgaoId, _pil:pilotoId };
  const daBase = (pilotoId === 'p1' && CONTEUDO[orgaoId] ? CONTEUDO[orgaoId].recomendacoes : [])
    .map(r => comoApagado(Object.assign({ doRelatorio:true }, r, c['r' + r.numero] || {}, { rid:'r' + r.numero }, origem)));
  const criadas = Object.keys(c).filter(k => !daBase.some(r => r.rid === k))
    .map(k => comoApagado(Object.assign({ acoes:[], paragrafos:[], criada:true }, c[k], { rid:k }, origem)));
  return daBase.concat(criadas).filter(r => !r.removido)
    .sort((x, y) => (x.numero || 0) - (y.numero || 0));
}
function recomendacoes(orgaoId, pilotoId){
  return recomendacoesTodas(orgaoId, pilotoId).filter(r => !r.apagado);
}

/* Piloto que o perfil esta observando. Com mais de um estudo no orgao a
   escolha e da secretaria, na tela Inicio, e vale para o sistema inteiro.
   Sem escolha feita, vale o primeiro estudo em andamento; o arquivado so
   abre direto quando e o unico.                                          */
function pilotoAtual(orgaoId){
  const ps = pilotos(orgaoId);
  if(!ps.length) return null;
  const meu = (state.perfil && state.perfil.id === orgaoId) ? state.piloto : null;
  return ps.filter(p => p.id === meu)[0] || ps.filter(p => !p.arquivado)[0] || ps[0];
}
/* Estudo arquivado aberto pela secretaria: tudo vira consulta. */
const arquivadoAberto = () =>
  !!(state.perfil && state.perfil.tipo !== 'sefa' && (pilotoAtual(state.perfil.id) || {}).arquivado);

/* Conteudo vigente de um perfil: o estudo observado e as suas recomendacoes.
   As telas continuam lendo daqui e nao precisam saber da configuracao.    */
function conteudoDe(id){
  const p = pilotoAtual(id);
  if(!p) return null;
  return { piloto:p, recomendacoes: recomendacoes(id, p.id),
           rotuloBloco:p.rotuloBloco, rotuloPlural:p.rotuloPlural };
}

/* ============================================================
   3. CAMADA DE DADOS
   Hoje os numeros sao derivados do conteudo local. Quando o
   backend existir, basta trocar o corpo de cada funcao por uma
   chamada fetch: o restante do sistema nao muda.
   ============================================================ */
const API = {
  BASE_URL: '',                       // ex.: 'https://api.saeqg.pr.gov.br'
  async _get(rota, perfil){
    // const r = await fetch(API.BASE_URL + rota + '?orgao=' + perfil.id, { credentials:'include' });
    // if(!r.ok) throw new Error('Falha em ' + rota); return r.json();
    return MOCK[rota](perfil);
  },
  /* Contrato esperado do backend:
       POST {BASE_URL}/auth/login  {orgao, email, senha}
         200 -> { ok:true, perfil:'<id do orgao>',
                  usuario:{ email, nivel:'gestor'|'restrito' } }
         401 -> { ok:false, erro:'E-mail ou senha inválidos.' }
         403 -> { ok:false, erro:'Este usuário não tem acesso a este órgão.' }
       A sessao deve voltar em cookie httpOnly, e nao em token guardado no
       navegador. Com o servidor, a senha e os acessos sao conferidos la, e
       autenticaLocal sai do ar.                                              */
  async autenticar(orgao, usuario, senha){
    // const r = await fetch(API.BASE_URL + '/auth/login', {
    //   method:'POST', credentials:'include',
    //   headers:{ 'Content-Type':'application/json' },
    //   body: JSON.stringify({ orgao, usuario, senha })
    // });
    // if(r.status === 401) return { ok:false, erro:'Usuário ou senha inválidos.' };
    // if(!r.ok) throw new Error('Falha na autenticação');
    // return r.json();
    return autenticaLocal(orgao, usuario, senha);
  },
  resumo:     perfil => API._get('/resumo', perfil),
  pendencias: perfil => API._get('/pendencias', perfil),
  /* Visao da coordenacao: todos os estudos no ar, com o registro vigente de
     cada acao. GET {BASE_URL}/consolidado devolve a forma descrita em
     consolida(), na secao 5B.                                             */
  consolidado: perfil => API._get('/consolidado', perfil)
};

const MOCK = {
  /* Recomendacao arquivada saiu do acompanhamento: nao entra nos contadores,
     mas continua visivel para consulta.                                   */
  '/resumo': perfil => {
    const recs = ((conteudoDe(perfil.id) || {}).recomendacoes || []).filter(r => !r.arquivado);
    const est  = leEstado(perfil.id);
    const sit  = recs.map(r => statusRecomendacao(r, est, perfil.id));
    const conta = s => sit.filter(x => x === s).length;
    return {
      recomendacoes: recs.length,
      naoIniciadas:  conta('nao_iniciada'),
      emAndamento:   conta('em_andamento'),
      concluidas:    conta('concluida'),
      atrasadas:     conta('atrasada')
    };
  },
  /* O contador de acoes concluidas sem evidencia continua aqui, lido no
     resumo do plano e no selo do proprio cartao.                           */
  '/pendencias': perfil => {
    const recs = ((conteudoDe(perfil.id) || {}).recomendacoes || []).filter(r => !r.arquivado);
    const est  = leEstado(perfil.id);
    let semEvidencia = 0;
    recs.forEach(r => acoesDaRec(r, perfil.id).forEach(a => {
      const e = est[a.codigo];
      if(acaoStatus(a, e) === 'concluida' && !evidenciasDe(e).length) semEvidencia++;
    }));
    return { evidencias: semEvidencia };
  },
  '/consolidado': () => consolida()
};

/* Cor de identidade de cada recomendacao, na ordem em que aparecem.
   Uma recomendacao pode fixar a sua com o campo cor. O vermelho fica
   reservado para o status atrasada, para nao competir com a leitura. */
const CORES_REC = ['214 72% 44%', '147 67% 37%', '40 82% 50%', '194 85% 38%', '262 60% 52%', '18 78% 50%'];
const corRec = (r, k) => r.cor || CORES_REC[k % CORES_REC.length];

/* Status agregado de uma recomendacao, mostrado na tela Inicio. */

const STATUS = {
  nao_iniciada: { rotulo:'Não iniciada', cor:'tx-info',  fundo:'bg-info',  icone:'aberto' },
  em_andamento: { rotulo:'Em andamento', cor:'tx-gold',  fundo:'bg-gold',  icone:'relogio' },
  concluida:    { rotulo:'Concluída',    cor:'tx-green', fundo:'bg-green', icone:'ok' },
  atrasada:     { rotulo:'Atrasada',     cor:'tx-red',   fundo:'bg-red',   icone:'alerta' }
};

/* Situacao de cada acao do plano. O atraso nao e situacao: e uma condicao
   derivada do prazo pactuado, por isso aparece como marcador e nao como coluna. */
const STATUS_ACAO = {
  nao_iniciada: { rotulo:'Não iniciada',         icone:'aberto' },
  em_execucao:  { rotulo:'Em execução',          icone:'relogio' },
  aguardando:   { rotulo:'Aguardando terceiros', icone:'pausa' },
  concluida:    { rotulo:'Concluída',            icone:'ok' }
};

/* ---- estado das acoes (prazo e situacao) --------------------------------
   Hoje fica no navegador de quem usa. Com backend, trocar leEstado e
   salvaEstado por GET e PUT em /orgaos/{id}/acoes. O resto nao muda.       */
/* O plano de acao pertence ao estudo, e nao ao orgao: dois pilotos do mesmo
   orgao podem ter uma acao 1.1 cada um. Por isso a chave traz os dois.    */
const chaveEstado = (r, id, pil) => PRE + r + '.' + id + '.' +
  (pil || (pilotoAtual(id) || {}).id || 'p1');

/* Ate a versao anterior havia um unico piloto por orgao e a chave nao o
   trazia. O que estiver na chave antiga passa para o estudo do relatorio
   na primeira leitura. Sai daqui quando o backend entrar.                */
function migraChaves(id){
  ['acoes', 'novas'].forEach(r => {
    const velha = PRE + r + '.' + id, nova = velha + '.p1';
    try{
      const v = localStorage.getItem(velha);
      if(v === null) return;
      if(localStorage.getItem(nova) === null) localStorage.setItem(nova, v);
      localStorage.removeItem(velha);
    }catch(e){}
  });
}

/* Quando uma acao sai do plano e as seguintes sobem uma posicao, o que ja
   estava registrado no navegador continua preso ao codigo antigo. Cada
   entrada abaixo move esses registros uma unica vez (a marca impede que a
   troca rode de novo sobre registros ja no codigo novo) e guarda a parte
   da acao retirada em chave propria, sem apagar nada. Sai com o backend.  */
const RENUMERACOES = [
  /* Retorno da SEAB, out/2026: a 1.6 ja foi executada e saiu do plano. */
  { marca:'seab.p1.2026-10', org:'seab', pil:'p1', retiradas:['1.6'],
    de:{ '1.7':'1.6', '1.8':'1.7' } },
  /* Retorno da SESA, out/2026: as recomendacoes deixaram de ser as fases do
     plano e passaram a ser as melhorias do redesenho, e os codigos antigos
     mudaram de assunto. Os registros da versao anterior eram de teste e nao
     sao transpostos: limpa guarda tudo a parte e o plano recomeca vazio. O
     texto que a SEFA tinha editado nas recomendacoes antigas tambem fica
     guardado (guardaCfg).                                                  */
  { marca:'sesa.p1.2026-10', org:'sesa', pil:'p1', limpa:true, guardaCfg:[1, 2, 3, 4] }
];
function renumera(id, pil){
  const p = pil || (pilotoAtual(id) || {}).id || 'p1';
  RENUMERACOES.filter(r => r.org === id && r.pil === p).forEach(r => {
    const feita = PRE + 'renum.' + r.marca;
    try{
      if(localStorage.getItem(feita)) return;
      const k   = chaveEstado('acoes', id, p);
      /* Estudo reorganizado (limpa): o registro anterior e as acoes criadas
         pelo orgao vao inteiros para a chave de retiradas, sem apagar nada,
         e o plano recomeca vazio.                                          */
      if(r.limpa){
        const kn = chaveEstado('novas', id, p);
        const a = localStorage.getItem(k), n = localStorage.getItem(kn);
        if(a || n) localStorage.setItem(PRE + 'retiradas.' + id + '.' + p,
          JSON.stringify({ acoes: JSON.parse(a) || {}, novas: JSON.parse(n) || [] }));
        localStorage.removeItem(k); localStorage.removeItem(kn);
        localStorage.setItem(feita, '1');
        return;
      }
      const est = JSON.parse(localStorage.getItem(k));
      if(est){
        const novo = {}, guarda = {};
        Object.keys(est).forEach(c => {
          if(r.retiradas.indexOf(c) >= 0) guarda[c] = est[c];
          else novo[r.de[c] || c] = est[c];
        });
        localStorage.setItem(k, JSON.stringify(novo));
        if(Object.keys(guarda).length){
          const kr = PRE + 'retiradas.' + id + '.' + p;
          const ja = JSON.parse(localStorage.getItem(kr)) || {};
          localStorage.setItem(kr, JSON.stringify(Object.assign(ja, guarda)));
        }
      }
      localStorage.setItem(feita, '1');
    }catch(e){}
  });
}

/* Quando a renumeracao muda o assunto das recomendacoes (guardaCfg), o
   texto que a coordenacao tinha editado nelas deixaria de corresponder:
   vai para uma chave propria, sem apagar, e as novas aparecem como no
   relatorio. Roda uma vez por navegador, na carga.                       */
(function guardaCfgRenumerada(){
  RENUMERACOES.filter(r => r.guardaCfg).forEach(r => {
    const feita = PRE + 'renum.cfg.' + r.marca;
    try{
      if(localStorage.getItem(feita)) return;
      const c   = leConfig();
      const ch  = chaveRec(r.org, r.pil);
      const rec = (c.recomendacoes || {})[ch];
      if(rec){
        const guarda = {};
        r.guardaCfg.forEach(n => { if(rec['r' + n]){ guarda['r' + n] = rec['r' + n]; delete rec['r' + n]; } });
        if(Object.keys(guarda).length){
          localStorage.setItem(PRE + 'retiradas.cfg.' + r.org + '.' + r.pil, JSON.stringify(guarda));
          salvaConfig(c);
        }
      }
      localStorage.setItem(feita, '1');
    }catch(e){}
  });
})();

/* Estudo alvo das janelas de acao. A secretaria edita o proprio plano; a
   coordenacao, na aba Acoes de Configuracoes, edita o de qualquer estudo,
   e para isso aponta state.alvo = { org, pil, rec } enquanto a janela esta
   aberta. Sem alvo, vale o perfil e o estudo que ele observa.            */
const orgAlvo = () => state.alvo ? state.alvo.org : (state.perfil && state.perfil.id);
const pilAlvo = () => state.alvo ? state.alvo.pil : undefined;

function leEstado(id, pil){
  if(!id){ id = orgAlvo(); pil = pil || pilAlvo(); }
  migraChaves(id);
  renumera(id, pil);
  try{ return JSON.parse(localStorage.getItem(chaveEstado('acoes', id, pil))) || {}; }
  catch(e){ return {}; }
}
function salvaEstado(est, id, pil){
  if(!id){ id = orgAlvo(); pil = pil || pilAlvo(); }
  try{ localStorage.setItem(chaveEstado('acoes', id, pil), JSON.stringify(est)); }catch(e){}
}
/* Alteracao direta no cartao (prazo, situacao, justificativa, arrasto no
   quadro). Entra no mesmo historico da janela de edicao, marcada como
   alteracao direta, para que o registro de atualizacoes seja completo.
   semLog serve a quem esta criando a acao: nao ha o que registrar ainda.   */
function atualizaAcao(codigo, campo, valor, semLog){
  const est   = leEstado();
  const antes = est[codigo];
  const de    = String(valorCampo(acaoPorCodigo(codigo), antes, campo) || '');
  const para  = String(valor || '');
  est[codigo] = Object.assign({}, antes);
  est[codigo][campo] = valor || null;
  if(!semLog && de !== para)
    est[codigo].historico = historicoDe(antes).concat([{
      id: 'h' + Date.now(),
      em: new Date().toISOString(),
      tipo: 'rapida',
      mudancas: [{ campo:campo, rotulo:rotuloCampo(campo), de:de, para:para }]
    }]);
  salvaEstado(est);
}

function removeEvidencia(codigo, id){
  const est = leEstado();
  const a = Object.assign({}, est[codigo]);
  a.evidencias = (a.evidencias || []).filter(x => x.id !== id);
  est[codigo] = a;
  salvaEstado(est);
}
const evidenciasDe = e => (e && e.evidencias) || [];

/* ---- ficha editavel da acao -------------------------------------------
   O relatorio final e a origem de cada acao e continua em CONTEUDO, intacto.
   O que o orgao escreve entra como camada por cima, no estado do proprio
   orgao, e e sempre o valor vigente. Por isso a ficha declara os campos uma
   unica vez: a janela de edicao, o cartao, o historico e o futuro backend
   leem todos desta mesma lista.                                           */
const CAMPOS_ACAO = [
  { id:'titulo',        rotulo:'Título da ação',                 tipo:'area',  origem:true, linhas:2,
    dica:'O que será feito' },
  { id:'descricao',     rotulo:'Descrição',                      tipo:'area',  origem:true, linhas:3,
    dica:'Detalhamento da ação, escopo e forma de execução.' },
  { id:'responsavel',   rotulo:'Responsável (unidade ou órgão)', tipo:'texto', origem:true,
    dica:'Unidade ou órgão responsável pela ação' },
  { id:'area',          rotulo:'Área responsável',               tipo:'texto',
    dica:'Departamento, coordenação ou divisão' },
  { id:'pessoa',        rotulo:'Pessoa responsável',             tipo:'texto',
    dica:'Nome de quem conduz a ação' },
  { id:'produto',       rotulo:'Produto esperado',               tipo:'area',  origem:true, linhas:2,
    dica:'Entregável que comprova a conclusão' },
  { id:'resultado',     rotulo:'Resultado esperado',             tipo:'area',  origem:true, linhas:2,
    dica:'O que passa a acontecer com o produto em uso' },
  { id:'status',        rotulo:'Situação',                       tipo:'status' },
  { id:'prazo',         rotulo:'Prazo pactuado',                 tipo:'data' },
  { id:'progresso',     rotulo:'Progresso',                      tipo:'percentual' },
  { id:'justificativa', rotulo:'Justificativa',                  tipo:'area', linhas:3,
    dica:'Por que a ação está nesta situação.' }
];
const campoPorId  = id => CAMPOS_ACAO.filter(c => c.id === id)[0] || { id:id, rotulo:id, tipo:'texto' };
const rotuloCampo = id => campoPorId(id).rotulo;

/* O texto dos relatorios ja vem com entidades HTML escritas (M&amp;A), por
   isso o & nao e reescapado aqui: seria escapa-lo duas vezes.             */
const esc = v => (v === null || v === undefined ? '' : String(v))
  .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* Regra de exibicao de campo sem valor: em toda a interface o vazio aparece
   como "A definir", para que a ficha nunca esconda o que falta preencher. O
   percentual e a unica excecao, porque zero por cento ja e informacao.     */
const A_DEFINIR = '<span class="vazio">A definir</span>';
const ouDefinir = v =>
  (v === null || v === undefined || String(v).trim() === '') ? A_DEFINIR : v;

/* Ponto focal para acompanhamento: area, pessoa e e-mail institucional,
   cadastrados pela SEFA no estudo (Configuracoes). Serve ao piloto e ao
   estudo do consolidado; comEmail acrescenta o e-mail quando existe.      */
const pontoFocal = (p, comEmail) => (p.focalArea || p.focalPessoa)
  ? ouDefinir(esc(p.focalArea)) + ' · ' + ouDefinir(esc(p.focalPessoa)) +
    (comEmail && p.focalEmail ? ' · ' + esc(p.focalEmail) : '')
  : A_DEFINIR;

/* Progresso em inteiro de 0 a 100. Acao concluida sem numero digitado vale
   100, para o cartao nao anunciar 0% no que ja terminou.                   */
function progressoAcao(a, e){
  const v = e && e.progresso;
  if(v === undefined || v === null || v === '')
    return acaoStatus(a, e) === 'concluida' ? 100 : 0;
  return Math.max(0, Math.min(100, parseInt(v, 10) || 0));
}

/* Valor vigente de um campo: o que o orgao escreveu, se escreveu; senao o
   que veio do relatorio. Campo em branco e escolha do orgao, nao ausencia. */
function valorCampo(a, e, campo){
  if(campo === 'status')    return acaoStatus(a, e);
  if(campo === 'progresso') return progressoAcao(a, e);
  const sobre = e && e[campo];
  if(sobre !== undefined && sobre !== null) return sobre;
  return (a && a[campo]) || '';
}

/* Localiza a acao pelo codigo em todas as recomendacoes do estudo: o do
   alvo, quando a coordenacao edita, ou o que o perfil observa.          */
function acaoPorCodigo(codigo){
  const recs = state.alvo ? recomendacoes(state.alvo.org, state.alvo.pil)
                          : (conteudoDe(state.perfil && state.perfil.id) || {}).recomendacoes || [];
  /* Procura tambem nas arquivadas, para a consulta do historico delas. */
  for(let i = 0; i < recs.length; i++){
    const achada = acoesDaRec(recs[i]).concat(acoesArquivadasDaRec(recs[i])).filter(x => x.codigo === codigo)[0];
    if(achada) return achada;
  }
  return null;
}

const historicoDe = e => (e && e.historico) || [];
const dataHoraBR = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' +
         d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
};
const isoHoje = () => {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

/* Um valor de campo escrito para leitura humana, usado no historico. */
function mostraValor(campo, v){
  if(v === '' || v === null || v === undefined) return A_DEFINIR;
  if(campo === 'status')    return (STATUS_ACAO[v] || {}).rotulo || v;
  if(campo === 'prazo')     return dataBR(v);
  if(campo === 'progresso') return v + '%';
  return esc(v);
}

/* Grava a janela de edicao inteira: aplica os campos, anexa a evidencia
   digitada, se houver, e guarda no historico a data, a hora, o que mudou e
   a propria janela como foi salva, para consulta depois.                   */
function salvaEdicaoAcao(codigo, a, valores, autor, evidencia){
  const est   = leEstado();
  const antes = est[codigo];
  const e     = Object.assign({}, antes);
  const mudancas = [], janela = {};

  /* So grava o que a janela traz. A atualizacao da secretaria grava sempre a
     situacao, o progresso e a justificativa; a edicao estrutural da
     coordenacao grava o campo que difere da ficha de origem e apaga o que
     voltou a ser igual a ela. Assim nenhum campo fica congelado: se o texto
     de origem mudar numa versao nova, a tela mostra o texto novo.          */
  const ACOMPANHAMENTO = ['status', 'progresso', 'justificativa'];
  CAMPOS_ACAO.forEach(c => {
    const de   = String(valorCampo(a, antes, c.id));
    const para = valores[c.id] === undefined ? de : String(valores[c.id]);
    janela[c.id] = para;
    if(de !== para) mudancas.push({ campo:c.id, rotulo:c.rotulo, de:de, para:para });
    if(valores[c.id] === undefined) return;
    const valor = c.id === 'progresso' ? (para === '' ? null : parseInt(para, 10) || 0) : para;
    if(ACOMPANHAMENTO.indexOf(c.id) >= 0) e[c.id] = valor;
    else if(para === String((a && a[c.id]) || '')) delete e[c.id];
    else e[c.id] = valor;
  });

  if(evidencia && evidencia.texto){
    e.evidencias = evidenciasDe(antes).concat([Object.assign({ id:'e' + Date.now() }, evidencia)]);
    mudancas.push({ campo:'evidencia', rotulo:'Evidência anexada', de:'', para:evidencia.texto });
  }

  /* A edicao estrutural da coordenacao nao entra no historico: o historico
     e o registro das atualizacoes de acompanhamento feitas pela secretaria. */
  if(!state.alvo)
    e.historico = historicoDe(antes).concat([{
      id: 'h' + Date.now(),
      em: new Date().toISOString(),
      tipo: 'edicao',
      autor: (autor || '').trim(),
      email: (state.usuario && state.usuario.email) || '',
      campos: janela,
      mudancas: mudancas
    }]);
  est[codigo] = e;
  salvaEstado(est);
  return mudancas.length;
}

/* ---- acoes acrescentadas pelo orgao ------------------------------------
   As acoes do relatorio ficam em CONTEUDO e nao podem ser removidas: sao o
   registro do documento. As que o orgao cria ficam a parte, marcadas, e
   podem ser excluidas por quem as criou.                                   */
function leNovas(id, pil){
  if(!id){ id = orgAlvo(); pil = pil || pilAlvo(); }
  migraChaves(id);
  renumera(id, pil);
  try{ return JSON.parse(localStorage.getItem(chaveEstado('novas', id, pil))) || []; }
  catch(e){ return []; }
}
function salvaNovas(arr, id, pil){
  cacheNum = {};
  if(!id){ id = orgAlvo(); pil = pil || pilAlvo(); }
  try{ localStorage.setItem(chaveEstado('novas', id, pil), JSON.stringify(arr)); }catch(e){}
}

/* Acao excluida pela coordenacao: fica na aba Apagados (apagado) ou saiu de
   vez (removido). A marca mora na configuracao, ramo acoes, por estudo e
   codigo, e vale para a acao do relatorio e para a criada no sistema.    */
function acaoFora(org, pil, codigo){
  const x = ((leConfig().acoes || {})[chaveRec(org, pil)] || {})[codigo];
  return !!(x && (x.apagado || x.removido));
}
/* Acao arquivada pela coordenacao: sai do acompanhamento e das contagens e
   fica so para consulta. A marca mora no mesmo ramo acoes da configuracao. */
const marcaAcao = (org, pil, codigo) => ((leConfig().acoes || {})[chaveRec(org, pil)] || {})[codigo] || {};
const acaoArquivada = (org, pil, codigo) => !!marcaAcao(org, pil, codigo).arquivado;
/* Acoes de uma recomendacao, do relatorio e criadas no sistema, sem as
   apagadas e sem as arquivadas. A numeracao de uma acao nova conta todas
   (comApagadas), para nao repetir um codigo que ainda pode voltar.       */
function acoesDaRec(rec, id, comApagadas){
  const org = rec._org || id, pil = rec._org ? rec._pil : undefined;
  const todas = (rec.acoes || []).concat(leNovas(org, pil).filter(a => a.rec === rec.numero));
  return comApagadas || !rec._org ? todas
    : todas.filter(a => !acaoFora(rec._org, rec._pil, a.codigo) && !acaoArquivada(rec._org, rec._pil, a.codigo));
}
/* Acoes arquivadas de uma recomendacao, fora as que tambem estao em Apagados. */
function acoesArquivadasDaRec(rec){
  if(!rec || !rec._org) return [];
  return acoesDaRec(rec, null, true)
    .filter(a => acaoArquivada(rec._org, rec._pil, a.codigo) && !acaoFora(rec._org, rec._pil, a.codigo));
}
/* ---- numeracao automatica ------------------------------------------------
   O codigo interno da acao (a.codigo) e o numero interno da recomendacao
   (rec.numero) ficam fixos: sao a chave do que a secretaria registrou e do
   que a coordenacao marcou. O numero que aparece na tela e calculado: conta
   so as recomendacoes e as acoes ativas (nem arquivadas nem apagadas), na
   ordem do cadastro. Arquivar, excluir ou restaurar renumera as demais na
   hora. O que esta fora da contagem aparece sem numero.                    */
function numeracao(org, pil){
  if(!org) return { rec:{}, acao:{} };
  pil = pil || (pilotoAtual(org) || {}).id || 'p1';
  const k = org + '|' + pil;
  if(cacheNum[k]) return cacheNum[k];
  const n = { rec:{}, acao:{} };
  recomendacoes(org, pil).filter(r => !r.arquivado).forEach((r, i) => {
    n.rec[r.rid] = i + 1;
    acoesDaRec(r).forEach((a, j) => { n.acao[a.codigo] = (i + 1) + '.' + (j + 1); });
  });
  return (cacheNum[k] = n);
}
/* Numero exibido de uma recomendacao (nada, se arquivada ou apagada). */
const numRec = r => (r && r._org) ? (numeracao(r._org, r._pil).rec[r.rid] || null) : null;
/* Codigo exibido de uma acao. Sem orgao e estudo, vale o da tela aberta: o
   alvo da coordenacao ou o estudo que o perfil observa.                   */
function codAcao(codigo, org, pil){
  if(!org){ org = orgAlvo(); pil = pilAlvo(); }
  return numeracao(org, pil).acao[codigo] || '';
}
/* Etiqueta do codigo. Sem numero nao ha etiqueta; nas tabelas em grade fica
   uma celula vazia, para as colunas nao saltarem.                         */
const chipCod   = (c, estilo) => c ? '<span class="cod"' + (estilo || '') + '>' + c + '</span>' : '';
const chipGrade = c => c ? chipCod(c) : '<span></span>';

function proximoCodigo(rec){
  const ns = acoesDaRec(rec, null, true).map(a => parseInt(String(a.codigo).split('.')[1], 10) || 0);
  return rec.numero + '.' + (Math.max.apply(null, [0].concat(ns)) + 1);
}
function adicionaAcaoNova(rec, dados){
  const nova = Object.assign({ codigo: proximoCodigo(rec), rec: rec.numero,
                               status: 'nao_iniciada', nova: true },
                             state.alvo ? { origem:'coordenacao' } : {}, dados);
  salvaNovas(leNovas().concat([nova]));
  return nova.codigo;
}
/* Uma atividade que se repete todo ano nao e uma acao com ciclos internos:
   sao acoes distintas, uma por exercicio, cada qual com o seu codigo, prazo,
   situacao e evidencias. O campo ciclo apenas marca o ano de referencia.     */
const ANO_LIMITE = 2030;
const selosCiclo = a => a.ciclo
  ? '<span class="badge b-ciclo">' + svg('repetir') + 'Ciclo ' + a.ciclo + '</span>' : '';
/* A justificativa acompanha qualquer situacao da acao, e nao so a espera por
   terceiros: em toda situacao o orgao registra por que a acao esta ali. O
   rotulo e sempre o mesmo, so o texto de apoio muda com a situacao. A falta
   continua sinalizada apenas em Aguardando terceiros, onde a explicacao e o
   que impede a coluna de virar deposito de acoes paradas sem motivo.         */
const APOIO_JUST = {
  nao_iniciada: 'Registre por que a ação ainda não começou e o que falta para iniciá-la.',
  em_execucao:  'Registre em que ponto a ação está e o que vem sendo executado.',
  aguardando:   'Descreva brevemente o que está sendo aguardado, de quem e desde quando.',
  concluida:    'Registre como a ação foi concluída e o que ficou entregue.'
};
function caixaJustificativa(a, e, compacto){
  const st  = acaoStatus(a, e);
  const txt = ((e && e.justificativa) || '').replace(/</g, '&lt;');
  if(compacto)
    return '<div class="kb-just"><div class="tit">Justificativa</div>' +
      '<p class="kb-just-txt">' + ouDefinir(txt) + '</p></div>';
  return '<div class="just">' +
    '<div class="just-tit">' + svg('doc') + 'Justificativa</div>' +
    '<p class="just-txt">' + ouDefinir(txt) + '</p>' +
    (!txt && st === 'aguardando'
      ? '<div class="falta">' + svg('alerta') + 'Justificativa ainda não registrada. ' +
        (APOIO_JUST[st] || APOIO_JUST.em_execucao) + '</div>' : '') +
  '</div>';
}

/* Evidencias em leitura. O registro e a remocao ficam na janela de edicao. */
function listaEvidencias(evs){
  if(!evs.length) return '<p class="ev-vazio">Nenhuma evidência registrada nesta ação.</p>';
  return '<ul class="ev-lista">' + evs.map(ev =>
    '<li class="ev-item"><span class="ic">' + svg('clipe') + '</span>' +
      '<div class="ev-corpo"><div class="ev-data">' + ouDefinir(dataBR(ev.data)) + '</div>' +
        '<p class="ev-texto">' + ouDefinir(String(ev.texto || '').replace(/</g, '&lt;')) + '</p>' +
        (ev.anexos && ev.anexos.length
          ? '<div class="ev-anexos">' + ev.anexos.map(x =>
              '<span class="anexo">' + svg('arquivo') + esc(x.nome) +
              '<em>' + tamanhoArq(x.tamanho) + '</em></span>').join('') + '</div>'
          : '') +
      '</div>' +
    '</li>').join('') + '</ul>';
}

const hojeZero = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const acaoStatus = (a, e) => (e && e.status) || a.status || 'nao_iniciada';
function acaoAtrasada(a, e){
  if(!e || !e.prazo || acaoStatus(a, e) === 'concluida') return false;
  return new Date(e.prazo + 'T00:00:00') < hojeZero();
}
/* A situacao da recomendacao e derivada das suas acoes, nunca digitada. */
function statusRecomendacao(rec, est, perfilId){
  const acoes = acoesDaRec(rec, perfilId);
  if(!acoes.length) return rec.status || 'nao_iniciada';
  if(acoes.some(a => acaoAtrasada(a, est[a.codigo]))) return 'atrasada';
  const sts = acoes.map(a => acaoStatus(a, est[a.codigo]));
  if(sts.every(s => s === 'concluida'))    return 'concluida';
  if(sts.every(s => s === 'nao_iniciada')) return 'nao_iniciada';
  return 'em_andamento';
}
const dataBR = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR') : '';

/* ============================================================
   4. ESTADO E TELAS
   ============================================================ */
/* Cada relatorio nomeia os seus blocos de um jeito. A SEAB e a SEDEST tratam
   por recomendacao; a SESA organiza o plano por fase. O rotulo vem do conteudo. */
const conteudoAtual = () => (state.perfil && conteudoDe(state.perfil.id)) || {};
const rotBloco  = () => conteudoAtual().rotuloBloco  || 'Recomendação';
const rotPlural = () => conteudoAtual().rotuloPlural || 'recomendações';
const rotTitulo = () => { const p = rotPlural(); return p.charAt(0).toUpperCase() + p.slice(1); };

const state = { perfil:null, orgaoSel:null, pagina:'inicio', rec:0, vis:'lista', resumo:null, pendencias:null, modal:null,
                /* quem entrou: { email, nivel } (nivel nulo antes do primeiro cadastro) */
                usuario:null,
                piloto:null, cfg:'secretarias', cfgOrg:null, cfgPil:null, cfgRec:null,
                /* estudo alvo da janela de acao quando quem edita e a coordenacao */
                alvo:null,
                /* coordenacao da SEFA: dados consolidados, estudo aberto, visao e
                   filtros de Proximas entregas e mes do calendario            */
                consol:null, sf:{ estudo:null, arq:false, vis:'lista', org:'', sit:'', per:'', q:'', mes:null },
                /* aviso do ultimo excluir, arquivar ou restaurar, com Desfazer */
                cfgAviso:null,
                /* acao escolhida no historico consolidado ('*' = todas) */
                histSel:null };
const $ = sel => document.querySelector(sel);


/* Orientacao no pe da tela de acesso, nas duas etapas. */
const AJUDA_ACESSO = 'Em caso de problemas de cadastro e acesso contactar a SEFA - Diretoria de ' +
  'Orçamento Estadual via e-mail ou telefone.';

function renderLogin(){
  const p = state.orgaoSel && orgaoPorId(state.orgaoSel);
  $('#login-passo').innerHTML = p ? passoCredenciais(p) : passoOrgao();
  p ? ligaCredenciais(p) : ligaEscolha();
}

/* Etapa 1: escolher o órgão. */
function passoOrgao(){
  return '<p class="login-hint">Selecione seu órgão</p>' +
    '<div class="profile-grid">' + orgaos().map(p => {
      /* A coordenação não acompanha um estudo, mas tem tela própria: o cartão
         dela nunca entra como em construção.                                */
      const noAr = !foraDoAr(p.id) && (p.tipo === 'sefa' || !!conteudoDe(p.id));
      const cls = 'profile' + (p.tipo === 'sefa' ? ' is-sefa' : '') + (noAr ? '' : ' is-obra');
      return '<button class="' + cls + '" data-perfil="' + p.id + '">' +
               '<span class="sig">' + esc(p.sigla) + '</span>' +
               '<span class="nm">' + esc(p.nome) + '</span>' +
               '<span class="rl">' + (noAr ? PAPEL[p.tipo].rotulo : 'Em construção') + '</span>' +
             '</button>';
    }).join('') + '</div>' +
    '<p class="login-foot">' + AJUDA_ACESSO + '</p>';
}

/* Etapa 2: credenciais do órgão escolhido. */
function passoCredenciais(p){
  return '<button type="button" class="voltar" id="btn-voltar">Trocar de órgão</button>' +
    '<div class="orgao-sel' + (p.tipo === 'sefa' ? ' is-sefa' : '') + '">' +
      '<span class="sig">' + p.sigla + '</span>' +
      '<span><b>' + p.orgao + '</b><em>' + PAPEL[p.tipo].eyebrow + '</em></span>' +
    '</div>' +
    '<form class="login-form" id="form-login" novalidate>' +
      '<label class="campo-login"><span>Login</span>' +
        '<input type="text" name="usuario" id="in-usuario" required autocomplete="username" ' +
          'autocapitalize="none" spellcheck="false" placeholder="Seu e-mail de acesso"></label>' +
      '<label class="campo-login"><span>Senha</span>' +
        '<span class="senha-wrap">' +
          '<input type="password" name="senha" id="in-senha" required ' +
            'autocomplete="current-password" placeholder="Sua senha">' +
          '<button type="button" class="ver-senha" id="ver-senha" aria-label="Mostrar senha">' +
            svg('olho') + '</button>' +
        '</span></label>' +
      '<p class="login-erro" id="login-erro" hidden></p>' +
      '<button type="submit" class="btn-entrar" id="btn-entrar">Entrar</button>' +
    '</form>' +
    '<p class="login-foot">' + AJUDA_ACESSO + '</p>';
}

function ligaEscolha(){
  $('#login-passo').querySelectorAll('[data-perfil]').forEach(b =>
    b.addEventListener('click', () => { state.orgaoSel = b.dataset.perfil; renderLogin(); }));
}

function ligaCredenciais(p){
  $('#btn-voltar').addEventListener('click', () => { state.orgaoSel = null; renderLogin(); });

  $('#ver-senha').addEventListener('click', () => {
    const campo = $('#in-senha'), oculta = campo.type === 'password';
    campo.type = oculta ? 'text' : 'password';
    $('#ver-senha').innerHTML = svg(oculta ? 'olhoOff' : 'olho');
    $('#ver-senha').setAttribute('aria-label', oculta ? 'Ocultar senha' : 'Mostrar senha');
    campo.focus();
  });

  $('#form-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = $('#btn-entrar'), erro = $('#login-erro');
    erro.hidden = true;
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try{
      const r = await API.autenticar(p.id, $('#in-usuario').value, $('#in-senha').value);
      if(!r || !r.ok){
        erro.textContent = (r && r.erro) || 'Não foi possível entrar.';
        erro.hidden = false;
        $('#in-senha').focus();
        return;
      }
      $('#in-senha').value = '';
      state.usuario = r.usuario || null;
      try{ sessionStorage.setItem(PRE + 'usuario', JSON.stringify(state.usuario)); }catch(e){}
      await entrar(r.perfil);
    }catch(e){
      erro.textContent = 'Não foi possível falar com o servidor. Tente novamente em instantes.';
      erro.hidden = false;
    }finally{
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });

  $('#in-usuario').focus();
}

async function entrar(id){
  const p = orgaoPorId(id);
  if(!p || p.apagado) return;
  state.perfil = p;
  state.rec = 0;
  /* O estudo observado volta como estava, se ainda existir no orgao. */
  let pil = null;
  try{ pil = sessionStorage.getItem(PRE + 'piloto.' + id); }catch(e){}
  state.piloto = null;
  state.piloto = pilotos(id).some(x => x.id === pil) ? pil : (pilotoAtual(id) || {}).id || null;
  try{ sessionStorage.setItem(PRE + 'perfil', id); }catch(e){}
  [state.resumo, state.pendencias] = await Promise.all([API.resumo(p), API.pendencias(p)]);
  $('#screen-login').hidden = true;
  $('#screen-app').hidden = false;
  montaShell();
  navega(location.hash.replace('#', '') || 'inicio');
}

function sair(){
  try{ sessionStorage.removeItem(PRE + 'perfil'); sessionStorage.removeItem(PRE + 'usuario'); }catch(e){}
  fechaModal();
  state.perfil = null;
  state.usuario = null;
  document.body.classList.remove('nav-open');
  state.orgaoSel = null;
  $('#screen-app').hidden = true;
  $('#screen-login').hidden = false;
  renderLogin();
  location.hash = '';
}

function montaShell(){
  const p = state.perfil;
  $('#u-avatar').textContent   = p.sigla;
  $('#u-name').textContent     = p.sigla + (p.tipo === 'sefa' ? ' · Coordenação' : '');
  /* Com usuario identificado, o rodape da barra mostra o e-mail de quem
     entrou; o orgao continua na pilula do topo.                         */
  const email = state.usuario && state.usuario.email;
  $('#u-org').textContent      = email || p.orgao;
  $('#u-org').title            = email ? email + ' · ' + p.orgao : p.orgao;
  $('#pill-org').textContent   = p.orgao + ' (' + p.sigla + ')';
  $('#tb-eyebrow').textContent = PAPEL[p.tipo].eyebrow;

  $('#sb-nav').innerHTML = menuAtual().map(m =>
    '<button class="sb-item" data-rota="' + m.id + '">' + svg(m.icone) +
    '<span>' + (m.id === 'recomendacoes' ? rotTitulo() : m.rotulo) + '</span></button>').join('');
  /* Pelo menu, Estudos sempre abre na carteira, e nao no ultimo estudo visto. */
  $('#sb-nav').querySelectorAll('[data-rota]').forEach(b =>
    b.addEventListener('click', () => { state.sf.estudo = null; state.sf.arq = false; navega(b.dataset.rota); }));
}

async function navega(rota){
  cacheNum = {};
  if(!menuAtual().some(m => m.id === rota)) rota = 'inicio';
  if(state.modal) fechaModal();
  state.cfgAviso = null;
  state.pagina = rota;
  location.hash = rota;
  document.body.classList.remove('nav-open');
  const item = menuAtual().find(m => m.id === rota);
  $('#tb-title').textContent = item.id === 'recomendacoes' ? rotTitulo() : item.rotulo;
  $('#sb-nav').querySelectorAll('[data-rota]').forEach(b =>
    b.classList.toggle('active', b.dataset.rota === rota));
  [state.resumo, state.pendencias] = await Promise.all([API.resumo(state.perfil), API.pendencias(state.perfil)]);
  /* A coordenacao le todos os estudos. */
  if(ehCoordenacao()){
    state.consol = await API.consolidado(state.perfil);
    state.consol.estudos.concat(state.consol.arquivados || []).forEach(s => { s.res = resumoEstudo(s); });
  }
  montaShell();
  $('#sb-nav').querySelectorAll('[data-rota]').forEach(b =>
    b.classList.toggle('active', b.dataset.rota === rota));
  desenhaPagina(item);
  window.scrollTo(0, 0);
}

function desenhaPagina(item){
  cacheNum = {};
  const conteudo = conteudoDe(state.perfil.id) || {};
  let html;
  if(item.id === 'config')                                       html = paginaConfig();
  else if(ehCoordenacao() && item.id === 'inicio')               html = paginaVisaoGeral();
  else if(ehCoordenacao() && item.id === 'estudos')              html = paginaEstudos();
  else if(ehCoordenacao() && item.id === 'entregas')             html = paginaEntregas();
  else if(!conteudo.recomendacoes)                               html = paginaVazia(item);
  else if(item.id === 'inicio')                                  html = paginaInicio(conteudo);
  else if(!conteudo.recomendacoes.length)                        html = paginaSemRecs(item);
  else if(item.id === 'recomendacoes')                           html = paginaRecomendacoes(conteudo);
  else if(item.id === 'planos')                                  html = paginaPlanos(conteudo);
  else                                                           html = paginaVazia(item);
  $('#page').innerHTML = html;
  ligaConfig(item);
  /* Trocar o estudo troca o conteudo de todas as telas, por isso recarrega
     os contadores do resumo em vez de so redesenhar a pagina.            */
  $('#page').querySelectorAll('[data-piloto]').forEach(el =>
    el.addEventListener('change', () => {
      state.piloto = el.value;
      state.rec = 0;
      try{ sessionStorage.setItem(PRE + 'piloto.' + state.perfil.id, el.value); }catch(e){}
      navega(state.pagina);
    }));
  $('#page').querySelectorAll('[data-ir]').forEach(b =>
    b.addEventListener('click', () => navega(b.dataset.ir)));
  $('#page').querySelectorAll('[data-rec]').forEach(b =>
    b.addEventListener('click', () => { state.rec = +b.dataset.rec; desenhaPagina(item); }));
  $('#page').querySelectorAll('[data-vis]').forEach(b =>
    b.addEventListener('click', () => { state.vis = b.dataset.vis; desenhaPagina(item); }));
  $('#page').querySelectorAll('[data-editar]').forEach(b =>
    b.addEventListener('click', ev => { ev.stopPropagation(); abreModal('edicao', b.dataset.editar); }));
  $('#page').querySelectorAll('[data-hist]').forEach(b =>
    b.addEventListener('click', () => abreModal('historico', b.dataset.hist)));
  $('#page').querySelectorAll('[data-histplano]').forEach(b =>
    b.addEventListener('click', () => abreModal('consolidado', null)));
  ligaAcoes(item);
  ligaSefa(item);
}

/* A secretaria nao cria nem remove acoes: isso e da coordenacao, na aba
   Acoes de Configuracoes.                                                */
function ligaAcoes(item){
  ligaArrastoRoadmap();
}

/* Arrastar a linha do tempo com o ponteiro, além da barra de rolagem. O
   arrasto só começa depois de alguns pixels, para não roubar o clique. */
function ligaArrastoRoadmap(){
  $('#page').querySelectorAll('.rm-rolagem.rola').forEach(faixa => {
    let ativo = false, movendo = false, x0 = 0, s0 = 0;
    faixa.addEventListener('pointerdown', ev => {
      if(ev.button !== 0) return;
      ativo = true; movendo = false;
      x0 = ev.clientX; s0 = faixa.scrollLeft;
    });
    faixa.addEventListener('pointermove', ev => {
      if(!ativo) return;
      const d = ev.clientX - x0;
      if(!movendo && Math.abs(d) < 5) return;
      if(!movendo){ movendo = true; faixa.classList.add('arrastando'); faixa.setPointerCapture(ev.pointerId); }
      faixa.scrollLeft = s0 - d;
    });
    const solta = () => { ativo = false; movendo = false; faixa.classList.remove('arrastando'); };
    faixa.addEventListener('pointerup', solta);
    faixa.addEventListener('pointercancel', solta);
    faixa.addEventListener('pointerleave', solta);
  });
}

/* Recomendacao em que a nova acao entra: a escolhida na aba Acoes, quando
   quem cria e a coordenacao, ou a aberta no Plano de Acao da secretaria. */
function recDaJanela(){
  if(state.alvo)
    return recomendacoes(state.alvo.org, state.alvo.pil).filter(r => r.numero === state.alvo.rec)[0];
  const recs = (conteudoDe(state.perfil.id) || {}).recomendacoes || [];
  return recs[recAtual(recs)];
}

/* Grava a acao criada pelo orgao, ou pela coordenacao, a partir da janela. */
function criaAcaoDaJanela(f){
  const rec    = recDaJanela();
  const titulo = f.titulo.value.trim();
  if(!titulo){ f.titulo.focus(); return false; }
  const base = {
    titulo: titulo,
    descricao: f.descricao.value.trim(),
    responsavel: f.responsavel.value.trim(),
    area: f.area.value.trim(),
    pessoa: f.pessoa.value.trim(),
    produto: f.produto.value.trim(),
    resultado: f.resultado.value.trim()
  };
  if(f.recorrente.checked){
    const de = new Date().getFullYear();
    for(let ano = de; ano <= ANO_LIMITE; ano++){
      const c = adicionaAcaoNova(rec, Object.assign({ ciclo: ano }, base));
      if(ano === de && f.prazo.value) atualizaAcao(c, 'prazo', f.prazo.value, true);
    }
  } else {
    const c = adicionaAcaoNova(rec, base);
    if(f.prazo.value) atualizaAcao(c, 'prazo', f.prazo.value, true);
  }
  return true;
}

  const t = d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

}

      }).join('') + '</dl>' +

        '<div><dt>Pessoa</dt><dd>' + ouDefinir(esc(pil.focalPessoa)) + '</dd></div>' +

          ? '<a href="mailto:' + esc(pil.focalEmail) + '">' + esc(pil.focalEmail) + '</a>' : A_DEFINIR) + '</dd></div>' +
      '</dl>' +
    '</div>';

  const status = [
    { k:'nao_iniciada', n:r.naoIniciadas, l:'Não iniciadas' },
    { k:'em_andamento', n:r.emAndamento,  l:'Em andamento' },

        '<div><div class="n ' + st.cor + '">' + (s.n ?? 0) + '</div><div class="l">' + s.l + '</div></div>' +
      '</div>';
