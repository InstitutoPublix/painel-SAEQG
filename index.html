/* ============================================================
   SAEQG · tokens de design
   Paleta, raio e tipografia extraidos do Sistema RAD (SEFA/PR)
   para manter identidade visual unica entre os dois sistemas.
   ============================================================ */
:root{
  --brasao-h: 124vh;
  --background: 216 42% 95%;
  --foreground: 217 47% 16%;
  --card: 0 0% 100%;
  --card-foreground: 217 47% 16%;
  --popover: 0 0% 100%;
  --primary: 214 72% 44%;
  --primary-foreground: 0 0% 100%;
  --secondary: 147 67% 37%;
  --secondary-foreground: 0 0% 100%;
  --muted: 210 40% 96%;
  --muted-foreground: 215 18% 43%;
  --accent: 40 82% 50%;
  --accent-foreground: 217 47% 16%;
  --destructive: 4 65% 54%;
  --destructive-foreground: 0 0% 100%;
  --border: 216 35% 92%;
  --input: 216 35% 92%;
  --ring: 214 72% 44%;
  --radius: .75rem;

  --sidebar-background: 214 74% 18%;
  --sidebar-foreground: 210 20% 95%;
  --sidebar-primary: 0 0% 100%;
  --sidebar-primary-foreground: 214 74% 18%;
  --sidebar-accent: 212 74% 24%;
  --sidebar-accent-foreground: 0 0% 100%;
  --sidebar-border: 212 60% 26%;
  --sidebar-ring: 40 82% 50%;

  --status-success: 147 67% 37%;
  --status-warning: 40 82% 50%;
  --status-danger: 4 65% 54%;
  --status-info: 194 85% 38%;

  --sefa-blue: 214 72% 44%;
  --sefa-blue-light: 214 74% 53%;
  --sefa-blue-dark: 214 74% 18%;
  --sefa-green: 147 67% 37%;
  --sefa-gold: 40 82% 50%;
  --sefa-red: 4 65% 54%;
  --sefa-light-blue: 214 65% 95%;

  --sidebar-w: 264px;
  --topbar-h: 62px;
  --content-max: 1024px;
}
.dark{
  --background: 215 25% 10%;
  --foreground: 210 20% 95%;
  --card: 215 25% 13%;
  --card-foreground: 210 20% 95%;
  --popover: 215 25% 13%;
  --primary: 214 72% 53%;
  --secondary: 147 55% 45%;
  --muted: 215 20% 18%;
  --muted-foreground: 215 15% 60%;
  --accent: 40 82% 50%;
  --accent-foreground: 0 0% 100%;
  --destructive: 0 62% 30.6%;
  --border: 215 20% 20%;
  --input: 215 20% 20%;
  --ring: 214 72% 53%;
  --sidebar-background: 215 25% 8%;
  --sidebar-foreground: 210 20% 90%;
  --sidebar-accent: 215 20% 15%;
  --sidebar-border: 215 20% 15%;
}

*,*::before,*::after{box-sizing:border-box}
/* Itens de grid e de flex têm largura mínima automática, e uma palavra longa
   basta para estourar a linha. Estes dois ajustes evitam rolagem horizontal. */
.profile,.rec-opt,.qa,.st,.card,.acao,.kb-card,.orgao-sel{min-width:0}
.profile .nm,.rec-opt h3,.rec-opt p,.qa h3,.qa p,.acao h3,.ev-top h3,.kb-card h4,
.acao-campos dd,.orgao-sel b,.ev-texto,.rm-lbl .tit{overflow-wrap:anywhere}
html,body{height:100%}
body{
  margin:0;
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:hsl(var(--background));
  color:hsl(var(--foreground));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.icon{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===================== TELA DE ACESSO ===================== */
/* justify-content:center com overflow corta o topo e o deixa inalcançável.
   Com flex-start e margens automáticas o cartão centraliza quando cabe e
   rola inteiro quando não cabe. */
#screen-login{
  position:fixed;inset:0;overflow:auto;overflow-x:hidden;
  scrollbar-gutter:stable both-edges;
  background:
    radial-gradient(120% 90% at 85% 105%, hsl(214 72% 34%) 0%, transparent 60%),
    linear-gradient(135deg, hsl(214 74% 13%) 0%, hsl(214 74% 18%) 48%, hsl(214 72% 27%) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:clamp(20px,4vh,56px) clamp(12px,3vw,20px) clamp(16px,3vh,20px);
}
#screen-login::before{ /* faixa tricolor superior */
  content:"";position:fixed;top:0;left:0;right:0;height:6px;z-index:3;
  background:linear-gradient(90deg,
    hsl(var(--sefa-green)) 0%, hsl(var(--sefa-green)) 41%,
    hsl(var(--sefa-gold)) 41%, hsl(var(--sefa-gold)) 100%);
}
#screen-login::after{ /* banda diagonal sutil */
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(118deg, transparent 34%, rgba(255,255,255,.045) 34%, rgba(255,255,255,.045) 62%, transparent 62%);
}
/* Brasao do Parana como marca d'agua. A arte entra pelo alfa de uma mascara,
   e a cor vem do proprio elemento, o que deixa o arquivo bem mais leve. */
#brasao{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  height:var(--brasao-h);width:auto;aspect-ratio:1078/1327;
  z-index:1;pointer-events:none;background:transparent;
}

.login-card{
  position:relative;z-index:2;width:100%;max-width:520px;margin-top:auto;
  background:hsl(var(--card));border-radius:12px;
  box-shadow:0 24px 60px -12px rgba(3,20,45,.45);
  padding:40px 40px 34px;text-align:center;
}
.login-logo{width:112px;height:auto;margin:0 auto 18px;display:block}
.login-title{font-size:max(12px,calc(28px * var(--fs)));font-weight:800;letter-spacing:.02em;margin:0;color:hsl(var(--foreground))}
.login-sub{font-size:max(12px,calc(13.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:6px 0 0;line-height:1.4}
.login-rule{height:1px;background:hsl(var(--border));margin:26px -40px 22px}
.login-hint{font-size:max(12px,calc(13.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:0 0 16px}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profile{
  border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));
  padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.profile:hover{border-color:hsl(var(--primary));box-shadow:0 6px 18px -6px hsl(var(--primary)/.35);transform:translateY(-2px)}
.profile:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
.profile .sig{
  width:46px;height:46px;border-radius:12px;display:grid;place-items:center;
  background:hsl(var(--sefa-light-blue));color:hsl(var(--primary));
  font-weight:800;font-size:13px;letter-spacing:.02em;
}
.profile.is-sefa .sig{background:hsl(var(--sefa-blue-dark));color:#fff}
.profile .nm{font-size:max(12px,calc(12.5px * min(var(--fs), 1.15)));font-weight:700;color:hsl(var(--foreground));line-height:1.2}
.profile .rl{font-size:max(12px,calc(10.5px * var(--fs)));color:hsl(var(--primary));line-height:1.25;margin-top:auto;padding-top:2px}
.profile.is-placeholder{border-style:dashed;background:hsl(var(--muted))}
.profile.is-placeholder .sig{background:hsl(216 35% 90%);color:hsl(var(--muted-foreground))}
.profile.is-placeholder .nm,.profile.is-placeholder .rl{color:hsl(var(--muted-foreground))}
.login-foot{margin-top:22px;font-size:max(12px,calc(13px * var(--fs)));color:hsl(var(--muted-foreground))}
.login-foot a{color:hsl(var(--primary));font-weight:700}
.login-foot .restrito{display:block;margin-top:8px;font-size:max(12px,calc(12.5px * var(--fs)))}
.page-foot{
  position:relative;z-index:2;margin-top:auto;padding-top:clamp(20px,4vh,38px);
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(210 40% 78%);text-align:center;
}

/* ===================== APLICACAO ===================== */
#screen-app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:hsl(var(--sidebar-background));color:hsl(var(--sidebar-foreground));
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;
}
.sb-brand{
  display:flex;align-items:center;gap:11px;padding:16px;
  background:hsl(214 74% 15%);border-bottom:1px solid hsl(var(--sidebar-border));
}
.sb-mark{width:42px;height:42px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:0 0 auto}
.sb-mark svg{width:24px;height:24px;color:hsl(var(--primary))}
.sb-brand .t1{font-size:max(12px,calc(17px * var(--fs)));font-weight:800;letter-spacing:.05em;line-height:1.1}
.sb-brand .t2{font-size:max(12px,calc(10.5px * var(--fs)));color:hsl(210 35% 72%);line-height:1.25;margin-top:2px}
.sb-nav{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.sb-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:11px 12px;border-radius:9px;font-size:max(12px,calc(14px * var(--fs)));font-weight:500;
  color:hsl(210 30% 84%);transition:background .15s,color .15s;text-align:left;
}
.sb-item:hover{background:hsl(var(--sidebar-accent)/.6);color:#fff}
.sb-item.active{background:hsl(var(--sidebar-accent));color:#fff;font-weight:600}
.sb-item .cnt{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:hsl(var(--destructive));color:#fff;font-size:max(12px,calc(11px * var(--fs)));font-weight:700;
  display:grid;place-items:center;
}
.sb-user{border-top:1px solid hsl(var(--sidebar-border));padding:14px 14px 10px}
.sb-user-row{display:flex;align-items:center;gap:11px}
.sb-avatar{
  width:40px;height:40px;border-radius:10px;background:hsl(var(--primary));color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:0 0 auto;
}
.sb-user .u1{font-size:max(12px,calc(13px * var(--fs)));font-weight:700;line-height:1.2}
.sb-user .u2{font-size:max(12px,calc(11px * var(--fs)));color:hsl(210 35% 72%);line-height:1.25;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.sb-logout{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 6px;
  border-radius:8px;font-size:max(12px,calc(13.5px * var(--fs)));color:hsl(210 30% 84%);width:100%}
.sb-logout:hover{background:hsl(var(--sidebar-accent)/.6);color:#fff}
.sb-logout .icon{width:17px;height:17px}

.main{flex:1;min-width:0;margin-left:var(--sidebar-w);display:flex;flex-direction:column}
.topbar{
  height:var(--topbar-h);background:hsl(var(--card));border-bottom:1px solid hsl(var(--border));
  display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:30;
}
.tb-burger{display:none;padding:6px;border-radius:8px;color:hsl(var(--muted-foreground))}
.tb-eyebrow{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.tb-title{font-size:max(12px,calc(19px * var(--fs)));font-weight:700;line-height:1.15;margin-top:1px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.org-pill{
  display:flex;align-items:center;gap:9px;background:hsl(var(--sefa-light-blue));
  color:hsl(var(--primary));border-radius:999px;padding:9px 18px;
  font-size:max(12px,calc(13px * var(--fs)));font-weight:700;max-width:44vw;
}
.org-pill .icon{width:16px;height:16px}
.org-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.content{padding:38px 24px 64px;overflow-x:hidden}
.container{max-width:var(--content-max);margin:0 auto}
.page-hello{font-size:max(12px,calc(26px * var(--fs)));font-weight:800;line-height:1.25;margin:0}
.page-date{font-size:max(12px,calc(14px * var(--fs)));color:hsl(var(--muted-foreground));margin:6px 0 0}
.section-label{
  font-size:max(12px,calc(11.5px * var(--fs)));font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin:34px 0 14px;
}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

.card{
  background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(16,38,72,.04);
}
.qa{padding:24px 22px 22px;display:flex;flex-direction:column;min-height:196px;position:relative;
  transition:box-shadow .18s,transform .18s,border-color .18s;text-align:left;width:100%}
.qa:hover{box-shadow:0 12px 26px -12px rgba(16,38,72,.28);transform:translateY(-2px);border-color:hsl(var(--primary)/.35)}
.qa .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:18px}
.qa .ic .icon{width:22px;height:22px}
.qa h3{font-size:max(12px,calc(17px * var(--fs)));font-weight:700;margin:0 0 8px;line-height:1.25}
.qa p{font-size:max(12px,calc(14px * var(--fs)));color:hsl(var(--muted-foreground));margin:0;line-height:1.4}
.qa .go{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:7px;
  color:hsl(var(--primary));font-size:max(12px,calc(14px * var(--fs)));font-weight:700}
.qa .go .icon{width:16px;height:16px}
.qa .pill{
  position:absolute;top:20px;right:20px;min-width:26px;height:26px;padding:0 8px;border-radius:999px;
  background:hsl(217 47% 16%);color:#fff;font-size:max(12px,calc(12.5px * var(--fs)));font-weight:700;display:grid;place-items:center;
}
.st{padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px}
.st .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff}
.st .ic .icon{width:20px;height:20px}
.st .n{font-size:max(12px,calc(30px * var(--fs)));font-weight:800;line-height:1}
.st .l{font-size:max(12px,calc(13.5px * var(--fs)));color:hsl(var(--muted-foreground));margin-top:6px}

.bg-blue{background:hsl(var(--primary))}
.bg-info{background:hsl(var(--status-info))}
.bg-gold{background:hsl(var(--status-warning))}
.bg-green{background:hsl(var(--status-success))}
.bg-red{background:hsl(var(--status-danger))}
.tx-info{color:hsl(var(--status-info))}
.tx-gold{color:hsl(var(--status-warning))}
.tx-green{color:hsl(var(--status-success))}
.tx-red{color:hsl(var(--status-danger))}

.empty{padding:64px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty .ic{width:56px;height:56px;border-radius:14px;background:hsl(var(--sefa-light-blue));
  color:hsl(var(--primary));display:grid;place-items:center}
.empty .ic .icon{width:26px;height:26px}
.empty h3{font-size:max(12px,calc(19px * var(--fs)));font-weight:700;margin:0}
.empty p{font-size:max(12px,calc(14px * var(--fs)));color:hsl(var(--muted-foreground));margin:0;max-width:460px;line-height:1.5}

.scrim{position:fixed;inset:0;background:rgba(8,24,50,.5);z-index:35;display:none}

@media (max-width:1080px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
}

/* Telas grandes: a leitura ganha largura e, na faixa de televisão, escala.
   O zoom amplia o layout inteiro sem exigir reescrita das medidas em px. */
@media (min-width:1700px){ :root{--content-max:1200px} }
@media (min-width:2200px){ :root{--content-max:1320px;--brasao-h:85vh} body{zoom:1.45} }
@media (min-width:3000px){ :root{--brasao-h:64vh} body{zoom:1.95} }
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .22s ease}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block}
  .main{margin-left:0}
  .tb-burger{display:grid;place-items:center}
  .org-pill{max-width:40vw}
}
@media (max-width:640px){
  .grid-4{grid-template-columns:1fr}
  .profile-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .login-card{padding:26px 18px 22px}
  .login-rule{margin-left:-18px;margin-right:-18px}
  .login-title{font-size:max(12px,calc(24px * var(--fs)))}
  .content{padding:24px 14px 48px}
  .org-pill span{display:none}
  .org-pill{padding:9px 12px}
  .topbar{padding:0 14px;gap:10px}
  .tb-title{font-size:max(12px,calc(17px * var(--fs)))}
  .page-hello{font-size:max(12px,calc(21px * var(--fs)))}
  .rec-body{padding:22px 18px}
  .acao{padding:18px 16px}
  .pl-views{width:100%;justify-content:space-between}
  .pl-views button{flex:1;padding:8px 6px}
}

/* Telefones estreitos: uma coluna resolve o que a divisão em duas não resolve. */
@media (max-width:400px){
  .profile-grid{grid-template-columns:1fr}
  .profile{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;text-align:left}
  .profile .sig{width:40px;height:40px;font-size:11.5px}
  .profile .rl{margin-top:0}
  .campo input,.campo select,.ciclo input,.ciclo select{min-width:0;width:100%}
  .ev-form-linha{gap:12px}
  .campo{width:100%}
}

/* ---------- resumo do estudo (Inicio) ---------- */
.about{padding:24px 24px 22px}
.about-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.about-head .ic{width:38px;height:38px;border-radius:10px;background:hsl(var(--sefa-light-blue));
  color:hsl(var(--primary));display:grid;place-items:center;flex:0 0 auto}
.about-head h3{font-size:max(12px,calc(16px * var(--fs)));font-weight:700;margin:0;line-height:1.2}
.about-head .prog{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));margin-top:2px}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin:0}
.about.focal{margin-top:18px}
.focal-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.focal-grid dd{overflow-wrap:anywhere}
.focal-grid a{color:hsl(var(--primary));text-decoration:none}
.focal-grid a:hover{text-decoration:underline}
.about-grid dt{font-size:max(12px,calc(10.5px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--primary));margin-bottom:5px}
.about-grid dd{margin:0;font-size:max(12px,calc(13.5px * var(--fs)));line-height:1.55}

/* ---------- seletor de recomendacoes ---------- */
.rec-sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px;margin:24px 0 26px}
.rec-opt{--rec:214 72% 44%;display:flex;gap:14px;align-items:flex-start;padding:18px;text-align:left;width:100%;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.rec-opt:hover{border-color:hsl(var(--rec)/.55);transform:translateY(-1px)}
.rec-opt.active{border-color:hsl(var(--rec));
  box-shadow:0 0 0 1px hsl(var(--rec)),0 12px 24px -16px hsl(var(--rec)/.8)}
.rec-opt .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:hsl(var(--rec)/.13);color:hsl(var(--rec));transition:background .15s,color .15s}
.rec-opt.active .ic{background:hsl(var(--rec));color:#fff}
.rec-opt .num{font-size:max(12px,calc(10.5px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--rec))}
.rec-opt h3{font-size:max(12px,calc(15px * var(--fs)));font-weight:700;margin:2px 0 5px;line-height:1.25}
.rec-opt p{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:0;line-height:1.4}

/* ---------- texto da recomendacao ---------- */
.rec-body{--rec:214 72% 44%;padding:30px 32px 32px;border-top:3px solid hsl(var(--rec))}
.rec-tags{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:max(12px,calc(11px * var(--fs)));font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;border-radius:999px;padding:5px 12px;
  color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}
.tag.info{color:hsl(var(--status-info));background:hsl(194 85% 38% / .12)}
.tag.rec{color:hsl(var(--rec));background:hsl(var(--rec)/.13)}
.tag .icon{width:13px;height:13px}
.rec-body h2{font-size:max(12px,calc(22px * var(--fs)));font-weight:800;margin:15px 0 0;line-height:1.3}
.rec-body .fonte{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:7px 0 22px}
.rec-body .txt p{font-size:max(12px,calc(14.5px * var(--fs)));line-height:1.72;margin:0 0 15px;text-align:justify}
.rec-body .txt p:last-child{margin-bottom:0}

@media (max-width:860px){
  .about-grid{grid-template-columns:1fr}
  .rec-sel{grid-template-columns:1fr}
  .rec-body{padding:24px 20px}
  .rec-body .txt p{text-align:left}
}

/* ---------- plano de acao: nota e barra ---------- */
.pl-nota{display:flex;gap:10px;align-items:flex-start;background:hsl(var(--muted));
  border:1px solid hsl(var(--border));border-radius:10px;padding:13px 15px;margin:0 0 20px;
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.55}
.pl-nota .icon{width:16px;height:16px;color:hsl(var(--primary));flex:0 0 auto;margin-top:1px}
.pl-nota b{color:hsl(var(--foreground));font-weight:700}
.pl-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 18px}
.pl-resumo{font-size:max(12px,calc(13.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.pl-resumo b{color:hsl(var(--foreground));font-weight:700}
.pl-views{margin-left:auto;display:flex;background:hsl(var(--muted));border-radius:9px;padding:3px;gap:3px}
.pl-views button{padding:7px 17px;border-radius:7px;font-size:max(12px,calc(13px * var(--fs)));font-weight:600;
  color:hsl(var(--muted-foreground))}
.pl-views button.active{background:hsl(var(--card));color:hsl(var(--primary));
  box-shadow:0 1px 3px rgba(16,38,72,.14)}

/* ---------- plano de acao: ficha em lista ---------- */
.acao{--rec:214 72% 44%;background:hsl(var(--card));border:1px solid hsl(var(--border));
  border-left:4px solid hsl(var(--rec));border-radius:var(--radius);padding:20px 22px;margin-bottom:14px}
.acao-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.cod{font-size:max(12px,calc(12px * var(--fs)));font-weight:800;letter-spacing:.04em;color:hsl(var(--rec));
  background:hsl(var(--rec)/.13);border-radius:6px;padding:4px 9px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:max(12px,calc(11.5px * var(--fs)));font-weight:700;
  border-radius:999px;padding:4px 11px;line-height:1.2}
.badge .icon{width:12px;height:12px}
.badge.b-nao_iniciada{color:hsl(var(--status-info));background:hsl(194 85% 38%/.13)}
.badge.b-em_execucao{color:hsl(38 82% 34%);background:hsl(var(--status-warning)/.18)}
.badge.b-aguardando{color:hsl(215 18% 40%);background:hsl(215 18% 43%/.13)}
.badge.b-concluida{color:hsl(var(--status-success));background:hsl(var(--status-success)/.13)}
.badge.b-atraso{color:hsl(var(--destructive));background:hsl(var(--destructive)/.13)}
.acao h3{font-size:max(12px,calc(16px * var(--fs)));font-weight:700;margin:0 0 9px;line-height:1.3}
.acao .desc{font-size:max(12px,calc(14px * var(--fs)));line-height:1.62;margin:0 0 4px;text-align:justify;white-space:pre-line}
.acao-campos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0 0;
  padding-top:16px;border-top:1px solid hsl(var(--border))}
.acao-campos dt{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin-bottom:5px}
.acao-campos dd{margin:0;font-size:max(12px,calc(13px * var(--fs)));line-height:1.5}
.acao-campos.duas{grid-template-columns:repeat(2,1fr)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo > span{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.campo input,.campo select{font:inherit;font-size:max(12px,calc(13.5px * var(--fs)));padding:8px 11px;border-radius:8px;
  border:1px solid hsl(var(--input));background:hsl(var(--card));color:hsl(var(--foreground));min-width:180px}
.campo input:focus,.campo select:focus{outline:2px solid hsl(var(--ring));outline-offset:1px;border-color:transparent}
.campo .dica{font-size:max(12px,calc(12px * var(--fs)));font-weight:400;letter-spacing:0;text-transform:none;
  color:hsl(var(--muted-foreground));padding-bottom:9px}

/* ---------- plano de acao: quadro ---------- */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kb-col{background:hsl(216 38% 92%);border-radius:11px;padding:11px}
.kb-col > header{display:flex;align-items:center;gap:7px;padding:4px 5px 11px;
  font-size:max(12px,calc(11.5px * var(--fs)));font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.kb-col > header .icon{width:14px;height:14px}
.kb-col > header .qt{margin-left:auto;background:hsl(var(--card));border-radius:999px;
  padding:1px 9px;font-size:max(12px,calc(11.5px * var(--fs)));color:hsl(var(--foreground))}
.kb-card{--rec:214 72% 44%;background:hsl(var(--card));border:1px solid hsl(var(--border));
  border-top:3px solid hsl(var(--rec));border-radius:9px;padding:12px 13px;margin-bottom:10px}
.kb-card:last-child{margin-bottom:0}
.kb-cod{display:flex;align-items:center;gap:8px;font-size:max(12px,calc(11px * var(--fs)));font-weight:800;
  letter-spacing:.04em;color:hsl(var(--rec))}
.kb-cod em{font-style:normal;font-weight:600;letter-spacing:0;color:hsl(var(--muted-foreground))}
.kb-card h4{font-size:max(12px,calc(13px * var(--fs)));font-weight:700;margin:8px 0 6px;line-height:1.35}
.kb-resp{font-size:max(12px,calc(11.5px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.4}
.kb-prazo{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:max(12px,calc(11.5px * var(--fs)));
  font-weight:600;color:hsl(var(--muted-foreground))}
.kb-prazo.late{color:hsl(var(--destructive))}
.kb-prazo .icon{width:12px;height:12px}
.kb-vazio{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));padding:10px 6px}

@media (max-width:1080px){
  .kb{grid-template-columns:repeat(2,1fr)}
  .acao-campos{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .kb{grid-template-columns:1fr}
  .acao-campos,.acao-campos.duas{grid-template-columns:1fr}
  .acao .desc{text-align:left}
  .pl-views{margin-left:0}
}

/* ---------- quadro: arrastar e soltar ---------- */
.kb-dica{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));margin:0 0 14px}

/* ---------- evidencias, dentro da ação ---------- */
.ev-lista{list-style:none;margin:14px 0 0;padding:14px 0 0;border-top:1px solid hsl(var(--border))}
.ev-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed hsl(var(--border))}
.ev-item:last-child{border-bottom:0;padding-bottom:0}
.ev-item .ic{width:32px;height:32px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  background:hsl(var(--rec)/.13);color:hsl(var(--rec))}
.ev-item .ic .icon{width:15px;height:15px}
.ev-corpo{flex:1;min-width:0}
.ev-data{font-size:max(12px,calc(11px * var(--fs)));font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.ev-texto{font-size:max(12px,calc(13.5px * var(--fs)));line-height:1.55;margin:4px 0 0}
.ev-anexos{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.anexo{display:inline-flex;align-items:center;gap:6px;font-size:max(12px,calc(11.5px * var(--fs)));font-weight:600;
  color:hsl(var(--primary));background:hsl(var(--sefa-light-blue));border-radius:7px;padding:5px 10px}
.anexo .icon{width:12px;height:12px}
.anexo em{font-style:normal;font-weight:400;color:hsl(var(--muted-foreground))}
.ev-remover{flex:0 0 auto;align-self:flex-start;padding:6px;border-radius:7px;
  color:hsl(var(--muted-foreground))}
.ev-remover:hover{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive))}
.ev-remover .icon{width:15px;height:15px}
.ev-rem{display:flex;flex-direction:column;gap:12px;margin-top:12px;padding:12px 14px;border-radius:9px;
  border:1px solid hsl(var(--destructive)/.35);background:hsl(var(--destructive)/.05)}
.ev-rem .mo-aviso,.ev-rem .mo-erro{margin:0}
.ev-rem .mo-aviso .icon{color:hsl(var(--destructive))}
.ev-rem input,.ev-rem textarea{width:100%;min-width:0}
.ev-rem-botoes{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.hi-rem{display:grid;gap:9px;margin:0}
.hi-rem dt{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.hi-rem dd{margin:2px 0 0;font-size:max(12px,calc(13px * var(--fs)));line-height:1.5;overflow-wrap:anywhere}
.ev-vazio{font-size:max(12px,calc(13px * var(--fs)));color:hsl(var(--muted-foreground));margin:14px 0 0;padding-top:14px;
  border-top:1px solid hsl(var(--border))}

.ev-add{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 15px;
  border-radius:8px;font-size:max(12px,calc(13.5px * var(--fs)));font-weight:600;color:hsl(var(--primary));
  background:hsl(var(--sefa-light-blue))}
.ev-add:hover{background:hsl(var(--primary));color:#fff}
.ev-add .icon{width:15px;height:15px}

.ev-form-linha{display:flex;gap:16px;flex-wrap:wrap}
.campo.cresce{flex:1 1 240px}
.campo textarea{font:inherit;font-size:max(12px,calc(13.5px * var(--fs)));padding:10px 12px;border-radius:8px;resize:vertical;
  border:1px solid hsl(var(--input));background:hsl(var(--card));color:hsl(var(--foreground));width:100%}
.campo textarea:focus{outline:2px solid hsl(var(--ring));outline-offset:1px;border-color:transparent}
.campo input[type="file"]{padding:7px 10px;font-size:max(12px,calc(12.5px * var(--fs)));width:100%}
.btn-primario{padding:10px 20px;border-radius:8px;font-size:max(12px,calc(13.5px * var(--fs)));font-weight:700;
  background:hsl(var(--primary));color:#fff}
.btn-primario:hover{background:hsl(214 72% 38%)}
.btn-neutro{padding:10px 18px;border-radius:8px;font-size:max(12px,calc(13.5px * var(--fs)));font-weight:600;
  color:hsl(var(--muted-foreground));background:hsl(var(--muted))}
.btn-neutro:hover{color:hsl(var(--foreground))}

@media (max-width:860px){
  .ev-form-linha{flex-direction:column}
}

/* ---------- plano de acao: roadmap ---------- */
.rm-wrap{padding:22px 24px}
.rm-rolagem{overflow-x:auto;overflow-y:hidden}
.rm-rolagem.rola{padding-bottom:12px;cursor:grab;scrollbar-width:thin;
  scrollbar-color:hsl(var(--primary)/.45) hsl(216 35% 91%)}
.rm-rolagem.rola.arrastando{cursor:grabbing;user-select:none}
.rm-rolagem.rola::-webkit-scrollbar{height:11px}
.rm-rolagem.rola::-webkit-scrollbar-track{background:hsl(216 35% 91%);border-radius:99px}
.rm-rolagem.rola::-webkit-scrollbar-thumb{background:hsl(var(--primary)/.45);border-radius:99px;
  border:2px solid hsl(var(--card))}
.rm-rolagem.rola::-webkit-scrollbar-thumb:hover{background:hsl(var(--primary)/.75)}
.rm-dica{display:flex;align-items:center;gap:8px;margin:0 0 14px;
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.rm-dica .icon{width:14px;height:14px;flex:0 0 auto;color:hsl(var(--primary))}
.rm{--lbl:300px;min-width:780px}
.rm-head{display:grid;grid-template-columns:var(--lbl) 1fr;align-items:end}
.rm-eixo{position:relative;height:24px;border-bottom:1px solid hsl(var(--border))}
.rm-mes{position:absolute;bottom:6px;transform:translateX(-50%);white-space:nowrap;
  font-size:max(12px,calc(10.5px * var(--fs)));font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.rm-mes::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;
  background:hsl(var(--border))}
.rm-corpo{position:relative}
.rm-hoje{position:absolute;top:0;bottom:6px;width:0;z-index:1;
  border-left:1.5px dashed hsl(var(--destructive)/.6)}
.rm-hoje em{position:absolute;top:2px;left:5px;font-style:normal;font-size:max(12px,calc(9.5px * var(--fs)));font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:hsl(var(--destructive))}
.rm-grupo{padding-top:18px}
.rm-grupo > h3{font-size:max(12px,calc(10.5px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin:0 0 6px}
.rm-linha{display:grid;grid-template-columns:var(--lbl) 1fr;align-items:center;padding:6px 0}
.rm-lbl{padding-right:18px;display:flex;gap:8px;align-items:flex-start}
.rm-lbl .cod{flex:0 0 auto;font-size:max(12px,calc(10px * var(--fs)));padding:3px 7px}
.rm-lbl > span:last-child{min-width:0}
.rm-lbl .tit{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:max(12px,calc(12.5px * var(--fs)));font-weight:600;line-height:1.32}
.rm-lbl .resp{display:block;font-size:max(12px,calc(11px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.3;
  margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-track{position:relative;height:30px}
.rm-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;
  transform:translateY(-50%);background:hsl(216 35% 91%);border-radius:2px}
.rm-atraso{position:absolute;top:50%;height:5px;transform:translateY(-50%);border-radius:3px;
  background:repeating-linear-gradient(45deg,hsl(var(--destructive)/.75) 0 4px,hsl(var(--destructive)/.28) 4px 8px)}
.rm-marco{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;
  font-size:max(12px,calc(11px * var(--fs)));font-weight:700;padding:4px 10px;border-radius:999px;
  background:hsl(var(--card));border:1.5px solid hsl(var(--rec));color:hsl(var(--rec))}
.rm-marco em{font-style:normal;margin-left:6px;padding-left:6px;
  border-left:1px solid currentColor;opacity:.75}
.rm-marco.esq{transform:translate(0,-50%)}
.rm-marco.dir{transform:translate(-100%,-50%)}
/* fundos solidos: o marco precisa continuar legivel sobre a faixa de atraso */
.rm-marco.m-em_execucao{background:hsl(41 92% 93%);border-color:hsl(var(--status-warning));color:hsl(38 84% 29%)}
.rm-marco.m-aguardando{background:hsl(215 28% 94%);border-color:hsl(215 18% 62%);color:hsl(215 20% 34%)}
.rm-marco.m-concluida{background:hsl(147 52% 93%);border-color:hsl(var(--status-success));color:hsl(147 68% 25%)}
.rm-marco.m-atrasada{background:hsl(4 88% 95%);border-color:hsl(var(--destructive));color:hsl(4 68% 41%)}
.rm-sem{margin-top:20px;padding-top:16px;border-top:1px solid hsl(var(--border));
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.5}
.rm-sem b{color:hsl(var(--foreground))}
.rm-sem ul{margin:8px 0 0;padding-left:19px;line-height:1.75}
.rm-vazio{padding:38px 8px;text-align:center;color:hsl(var(--muted-foreground));font-size:max(12px,calc(13.5px * var(--fs)))}

/* ---------- acao adicionada pelo orgao ---------- */
.badge.b-nova{color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}
.btn-remover{display:inline-flex;align-items:center;gap:7px;margin-left:auto;align-self:center;
  padding:8px 13px;border-radius:8px;font-size:max(12px,calc(12.5px * var(--fs)));font-weight:600;
  color:hsl(var(--muted-foreground))}
.btn-remover:hover{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive))}
.btn-remover .icon{width:14px;height:14px}
#form-nova .campo input[type="text"],#form-nova .campo textarea{width:100%}
#form-nova > .mo-grupo{display:flex;flex-direction:column;gap:14px;padding-top:4px}
#form-nova > .mo-grupo > .campo.cresce{flex:none}

/* ---------- campos ainda nao preenchidos ---------- */
.vazio{color:hsl(var(--muted-foreground));font-style:italic;font-weight:400}

/* ---------- seletor do estudo observado ---------- */
.pil-sel{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:22px;
  padding:15px 18px;border-radius:var(--radius);background:hsl(var(--card));
  border:1px solid hsl(var(--border))}
.pil-sel .campo{flex:0 1 380px;min-width:0}
.pil-sel .campo select{width:100%}
.pil-dica{display:flex;align-items:center;gap:7px;margin:0 0 9px;
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.pil-dica .icon{width:14px;height:14px;flex:0 0 auto;color:hsl(var(--primary))}

/* ---------- configurações da coordenação ---------- */
.cfg-abas{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}
.cfg-abas button{padding:9px 18px;border-radius:9px;font-size:max(12px,calc(13.5px * var(--fs)));font-weight:600;
  color:hsl(var(--muted-foreground));background:hsl(var(--muted))}
.cfg-abas button:hover{color:hsl(var(--foreground))}
.cfg-abas button.active{background:hsl(var(--primary));color:#fff}
.cfg-escolha{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:15px 18px;
  border-radius:var(--radius);background:hsl(var(--card));border:1px solid hsl(var(--border))}
.cfg-escolha .campo{flex:1 1 260px;min-width:0}
.cfg-escolha .campo select{width:100%}
.cfg-item{background:hsl(var(--card));border:1px solid hsl(var(--border));
  border-left:4px solid hsl(var(--primary));border-radius:var(--radius);
  padding:16px 20px;margin-bottom:12px}
.cfg-item.is-oculto{border-left-color:hsl(215 18% 62%);background:hsl(216 38% 97%)}
.cfg-item.is-oculto .cfg-top h3{color:hsl(var(--muted-foreground))}
.cfg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-top h3{font-size:max(12px,calc(15px * var(--fs)));font-weight:700;margin:0;line-height:1.3;flex:1 1 240px;min-width:0}
.cfg-top .cod{color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}
.cfg-meta{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.5;margin:9px 0 0}
.cfg-item .acao-acoes{margin-top:13px;padding-top:12px}

/* ---------- seções do cartão da ação, iguais às da janela de edição ---------- */
.acao-sec{margin-top:16px;padding-top:15px;border-top:1px solid hsl(var(--border))}
.acao-sec > h4{display:flex;align-items:center;gap:9px;margin:0 0 12px;
  font-size:max(12px,calc(11px * var(--fs)));font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:hsl(var(--primary))}
.acao-sec > h4 .qt{font-size:max(12px,calc(10px * var(--fs)));font-weight:800;letter-spacing:0;border-radius:999px;
  padding:1px 8px;background:hsl(var(--sefa-light-blue));color:hsl(var(--primary))}
.acao-sec .acao-campos{margin:0;padding-top:0;border-top:0}
.acao-sec .pg{margin-top:14px;padding-top:0;border-top:0}
.acao-sec .just{margin-top:14px}
.acao-sec .ev-lista,.acao-sec .ev-vazio{margin-top:0;padding-top:0;border-top:0}

/* ---------- remover a acao, agora no rodape da janela ---------- */
.mo-rodape .btn-remover{margin-left:0;margin-right:auto}

/* ---------- marcador de exercicio das acoes anuais ---------- */
.badge.b-ciclo{color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}

/* ---------- roadmap sem agrupamento ---------- */
.rm-lista{padding-top:16px}

/* ---------- caixa de marcacao no formulario ---------- */
.campo.check{flex-direction:row;align-items:center;gap:9px;padding-bottom:9px}
.campo.check input{width:16px;height:16px;min-width:0;accent-color:hsl(var(--primary))}
.campo.check > span{text-transform:none;letter-spacing:0;font-size:max(12px,calc(13px * var(--fs)));font-weight:500;
  color:hsl(var(--foreground))}

/* ---------- justificativa da ação, em qualquer situação ---------- */
.just{margin-top:16px;padding:13px 15px;border-radius:10px;background:hsl(215 28% 96%);
  border:1px solid hsl(var(--border));border-left:3px solid hsl(215 18% 62%)}
.just-tit{display:flex;align-items:center;gap:7px;margin-bottom:8px;
  font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:hsl(215 20% 40%)}
.just-tit .icon{width:12px;height:12px}
.just-txt{font-size:max(12px,calc(13.5px * var(--fs)));line-height:1.6;margin:0;color:hsl(var(--foreground))}
.just .falta{display:flex;align-items:center;gap:6px;margin-top:8px;
  font-size:max(12px,calc(12px * var(--fs)));font-weight:600;color:hsl(38 82% 32%)}
.just .falta .icon{width:13px;height:13px}
.kb-just{margin-top:10px}
.kb-just .tit{font-size:max(12px,calc(9px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin-bottom:4px}
.kb-just-txt{font-size:max(12px,calc(11.5px * var(--fs)));line-height:1.45;margin:0;color:hsl(var(--foreground))}
.kb-evid{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:max(12px,calc(11px * var(--fs)));font-weight:600;
  color:hsl(var(--muted-foreground))}
.kb-evid .icon{width:12px;height:12px}

/* ---------- progresso da ação ---------- */
.pg{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid hsl(var(--border))}
.pg-rot{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));flex:0 0 auto}
.pg-barra{flex:1 1 auto;height:7px;border-radius:99px;background:hsl(216 35% 90%);overflow:hidden}
.pg-barra i{display:block;height:100%;border-radius:99px;background:hsl(var(--rec,214 72% 44%))}
.pg-num{flex:0 0 auto;font-size:max(12px,calc(13px * var(--fs)));font-weight:700;color:hsl(var(--foreground));
  font-variant-numeric:tabular-nums}
.kb-pg{display:flex;align-items:center;gap:7px;margin-top:9px}
.kb-pg .pg-barra{height:5px}
.kb-pg .pg-num{font-size:max(12px,calc(11px * var(--fs)))}

/* ---------- botões de rodapé da ação ---------- */
.acao-acoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;
  padding-top:15px;border-top:1px solid hsl(var(--border))}
.btn-acao{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;
  font-size:max(12px,calc(13px * var(--fs)));font-weight:600;color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}
.btn-acao:hover{background:hsl(var(--primary));color:#fff}
.btn-acao .icon{width:14px;height:14px}
.btn-acao.neutra{color:hsl(var(--muted-foreground));background:hsl(var(--muted))}
.btn-acao.neutra:hover{background:hsl(215 20% 84%);color:hsl(var(--foreground))}
.btn-acao .qt{font-size:max(12px,calc(11px * var(--fs)));font-weight:800;padding:1px 7px;border-radius:99px;
  background:hsl(var(--foreground)/.11)}
.kb-editar{display:inline-flex;align-items:center;gap:6px;margin-top:9px;padding:5px 9px;
  border-radius:7px;font-size:max(12px,calc(11.5px * var(--fs)));font-weight:600;
  color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}
.kb-editar:hover{background:hsl(var(--primary));color:#fff}
.kb-editar .icon{width:12px;height:12px}

/* ---------- janela de edição e de histórico ---------- */
body.modal-aberto{overflow:hidden}
.mo-fundo{position:fixed;inset:0;z-index:80;background:hsl(214 40% 12%/.5);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 18px;overflow-y:auto}
.mo-caixa{width:100%;max-width:880px;background:hsl(var(--card));border-radius:14px;
  box-shadow:0 24px 60px hsl(214 40% 12%/.28);display:flex;flex-direction:column;
  margin:auto;overflow:hidden}
.mo-topo{display:flex;align-items:flex-start;gap:14px;padding:18px 22px;
  border-bottom:1px solid hsl(var(--border));background:hsl(var(--muted))}
.mo-topo .tit{min-width:0;display:flex;flex-direction:column;gap:6px}
.mo-topo .tit b{font-size:max(12px,calc(15.5px * var(--fs)));line-height:1.4;overflow-wrap:anywhere}
.mo-topo .tit .cod{align-self:flex-start}
.mo-eyebrow{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.mo-fechar{margin-left:auto;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  color:hsl(var(--muted-foreground));flex:0 0 auto}
.mo-fechar:hover{background:hsl(var(--destructive)/.1);color:hsl(var(--destructive))}
.mo-corpo{padding:6px 22px 20px;display:flex;flex-direction:column;gap:2px;
  max-height:calc(100vh - 200px);overflow-y:auto}
.mo-grupo{padding:18px 0;border-bottom:1px dashed hsl(var(--border))}
.mo-grupo:last-child{border-bottom:0}
.mo-grupo > h4{margin:0 0 13px;font-size:max(12px,calc(11px * var(--fs)));font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:hsl(var(--primary))}
.mo-linha{display:flex;gap:16px;flex-wrap:wrap}
.mo-linha + .mo-linha{margin-top:14px}
.mo-linha .campo{flex:1 1 220px;min-width:0}
.mo-linha .campo input,.mo-linha .campo select{min-width:0;width:100%}
.mo-aviso{display:flex;align-items:flex-start;gap:8px;margin:13px 0 0;
  font-size:max(12px,calc(12.5px * var(--fs)));line-height:1.5;color:hsl(var(--muted-foreground))}
.mo-aviso .icon{width:14px;height:14px;flex:0 0 auto;margin-top:2px;color:hsl(var(--primary))}
.mo-origem{margin:6px 0 0;font-size:max(12px,calc(11.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.mo-rodape{display:flex;gap:10px;justify-content:flex-end;padding:15px 22px;
  border-top:1px solid hsl(var(--border));background:hsl(var(--muted))}
.mo-rodape .btn-primario{display:inline-flex;align-items:center;gap:8px}
.mo-rodape .btn-primario .icon{width:15px;height:15px}
.pct-campo{position:relative;display:block}
.pct-campo input{width:100%;padding-right:32px}
.pct-campo em{position:absolute;top:50%;right:12px;transform:translateY(-50%);
  font-style:normal;font-size:max(12px,calc(13px * var(--fs)));font-weight:700;color:hsl(var(--muted-foreground))}
.pct-barra{display:block;height:6px;border-radius:99px;background:hsl(216 35% 90%);overflow:hidden}
.pct-barra i{display:block;height:100%;border-radius:99px;background:hsl(var(--primary));
  transition:width .12s linear}

/* ---------- histórico de atualizações ---------- */
.hi-item{border:1px solid hsl(var(--border));border-radius:11px;padding:14px 16px;margin-bottom:11px;
  background:hsl(var(--card))}
.hi-topo{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.hi-n{font-size:max(12px,calc(11px * var(--fs)));font-weight:800;color:hsl(var(--muted-foreground))}
.hi-quando{font-size:max(12px,calc(13px * var(--fs)));font-weight:700}
.hi-autor{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground))}
.badge.b-edicao{color:hsl(var(--primary));background:hsl(var(--sefa-light-blue))}
.badge.b-rapida{color:hsl(215 18% 40%);background:hsl(215 18% 43%/.13)}
.hi-mud{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.hi-mud li{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:max(12px,calc(13px * var(--fs)));line-height:1.5}
.hi-mud li b{flex:0 0 auto;font-size:max(12px,calc(11px * var(--fs)));font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.hi-mud .de{color:hsl(var(--muted-foreground));text-decoration:line-through;overflow-wrap:anywhere}
.hi-mud .para{font-weight:600;overflow-wrap:anywhere}
.hi-mud .icon{width:13px;height:13px;flex:0 0 auto;color:hsl(var(--muted-foreground))}
.hi-mud .vazio{font-style:italic;text-decoration:none}
.hi-sem{margin:0;font-size:max(12px,calc(13px * var(--fs)));font-style:italic;color:hsl(var(--muted-foreground))}
.hi-snap{margin-top:11px}
.hi-snap summary{cursor:pointer;font-size:max(12px,calc(12.5px * var(--fs)));font-weight:600;color:hsl(var(--primary))}
.hi-snap dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;
  margin:12px 0 0;padding:13px 15px;border-radius:9px;background:hsl(var(--muted))}
.hi-snap dt{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin-bottom:4px}
.hi-snap dd{margin:0;font-size:max(12px,calc(13px * var(--fs)));line-height:1.5;overflow-wrap:anywhere}
.hi-acao{font-size:max(12px,calc(11px * var(--fs)));font-weight:800;letter-spacing:.04em;color:hsl(var(--primary));
  background:hsl(var(--sefa-light-blue));border-radius:6px;padding:3px 8px}

@media (max-width:720px){
  .mo-fundo{padding:0}
  .mo-caixa{max-width:none;border-radius:0;min-height:100%}
  .mo-corpo{max-height:none}
  .mo-linha{flex-direction:column}
  .hi-snap dl{grid-template-columns:1fr}
}

/* ---------- perfil ainda sem conteúdo carregado ---------- */
.profile.is-obra .sig{background:hsl(216 35% 92%);color:hsl(var(--muted-foreground))}
.profile.is-sefa.is-obra .sig{background:hsl(var(--sefa-blue-dark));color:#fff}
.profile.is-obra .rl{color:hsl(var(--muted-foreground))}


/* ---------- formulário de acesso ---------- */
.login-form{display:flex;flex-direction:column;gap:15px;text-align:left}
.campo-login{display:flex;flex-direction:column;gap:6px}
.campo-login > span{font-size:max(12px,calc(11px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.campo-login input{font:inherit;font-size:max(12px,calc(14.5px * var(--fs)));width:100%;padding:12px 14px;border-radius:9px;
  border:1px solid hsl(var(--input));background:hsl(var(--card));color:hsl(var(--foreground))}
.campo-login input:focus{outline:2px solid hsl(var(--ring));outline-offset:1px;border-color:transparent}
.campo-login input::placeholder{color:hsl(215 16% 65%)}
.senha-wrap{position:relative;display:block}
.senha-wrap input{padding-right:46px}
.ver-senha{position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  color:hsl(var(--muted-foreground))}
.ver-senha:hover{background:hsl(var(--muted));color:hsl(var(--primary))}
.ver-senha .icon{width:18px;height:18px}
.btn-entrar{margin-top:3px;padding:13px 20px;border-radius:9px;font-size:max(12px,calc(15px * var(--fs)));font-weight:700;
  background:hsl(var(--primary));color:#fff;width:100%}
.btn-entrar:hover{background:hsl(214 72% 38%)}
.btn-entrar:disabled{opacity:.65;cursor:default}
.login-erro{margin:0;padding:10px 13px;border-radius:9px;font-size:max(12px,calc(13px * var(--fs)));font-weight:600;
  color:hsl(4 68% 40%);background:hsl(var(--destructive)/.11);
  border-left:3px solid hsl(var(--destructive))}
.login-foot .sep{margin:0 7px;color:hsl(216 25% 80%)}
.login-aviso{display:block;margin-top:9px;font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--primary))}

/* ---------- órgão escolhido na etapa de credenciais ---------- */
.voltar{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;
  font-size:max(12px,calc(12.5px * var(--fs)));font-weight:600;color:hsl(var(--muted-foreground))}
.voltar::before{content:"";width:6px;height:6px;border-left:1.6px solid currentColor;
  border-bottom:1.6px solid currentColor;transform:rotate(45deg)}
.voltar:hover{color:hsl(var(--primary))}
.orgao-sel{display:flex;align-items:center;gap:13px;text-align:left;margin-bottom:22px;
  padding:14px 16px;border-radius:11px;background:hsl(var(--sefa-light-blue))}
.orgao-sel .sig{width:46px;height:46px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;
  background:hsl(var(--card));color:hsl(var(--primary));font-size:12.5px;font-weight:800}
.orgao-sel.is-sefa .sig{background:hsl(var(--sefa-blue-dark));color:#fff}
.orgao-sel > span:last-child{min-width:0}
.orgao-sel b{display:block;font-size:max(12px,calc(14px * var(--fs)));font-weight:700;line-height:1.3;color:hsl(var(--foreground))}
.orgao-sel em{display:block;margin-top:3px;font-style:normal;font-size:max(12px,calc(11.5px * var(--fs)));
  color:hsl(var(--primary));font-weight:600}
.demo-nota{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.5;
  margin:20px 0 0;padding-top:16px;border-top:1px solid hsl(var(--border))}

/* ===================== COORDENAÇÃO DA SEFA ===================== */
/* Visão geral, Estudos e Próximas entregas. Tudo é leitura. */
.sf{--rec:214 72% 44%}
.sf .section-label{margin:34px 0 14px}
.sf-intro{font-size:max(12px,calc(13px * var(--fs)));color:hsl(var(--muted-foreground));margin:-6px 0 14px;line-height:1.5}


/* números de topo */
.st .sub{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));margin-top:4px;line-height:1.35}
.bg-cinza{background:hsl(215 18% 55%)}

/* barra de prazos: uma ação conta em um só grupo */
.sf-part{padding:18px 22px;margin-top:20px}
.sf-part h3{font-size:max(12px,calc(14px * var(--fs)));font-weight:700;margin:0 0 12px}
.sf-barra{display:flex;gap:2px;height:14px}
.sf-barra i{display:block;height:100%;border-radius:4px;min-width:4px}
.s-dentro{background:hsl(var(--status-success))}
.s-atraso{background:hsl(var(--status-danger))}
.s-sem{background:hsl(215 16% 74%)}
.sf-leg{list-style:none;margin:12px 0 0;padding:0;display:flex;gap:8px 24px;flex-wrap:wrap;
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.sf-leg li{display:flex;align-items:center;gap:7px}
.sf-leg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.sf-leg b{color:hsl(var(--foreground));font-weight:700}
.sf-leg em{font-style:normal}

/* sigla do órgão */
.sf-sig{display:inline-grid;place-items:center;min-width:52px;height:28px;padding:0 8px;border-radius:8px;
  background:hsl(var(--sefa-light-blue));color:hsl(var(--primary));
  font-size:max(12px,calc(11.5px * var(--fs)));font-weight:800;letter-spacing:.03em;white-space:nowrap;flex:0 0 auto}

/* situação de cada estudo */
.sf-est{overflow:hidden}
.sf-est-linha{display:grid;grid-template-columns:64px minmax(0,1.7fr) minmax(0,1fr) 250px 18px;
  gap:16px;align-items:center;width:100%;padding:14px 18px;text-align:left;
  border-top:1px solid hsl(var(--border));transition:background .15s}
.sf-est-linha:first-child{border-top:0}
.sf-est-linha:hover{background:hsl(var(--sefa-light-blue)/.6)}
.sf-est-nome{min-width:0}
.sf-est-nome b{display:block;font-size:max(12px,calc(14px * var(--fs)));font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.sf-est-nome em{display:block;font-style:normal;font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));
  margin-top:2px;line-height:1.35}
.sf-sinais{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sf-dados{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sf-dado{font-size:max(12px,calc(13px * var(--fs)));font-weight:600;line-height:1.3}
.sf-dado small{display:block;font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin-bottom:3px}
.sf-seta{color:hsl(var(--muted-foreground));display:grid;place-items:center}
.sf-seta .icon{width:16px;height:16px}
.sf-como{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));margin:10px 2px 0;line-height:1.65}
.sf-como b{color:hsl(var(--foreground));font-weight:700}

/* duas colunas: pontos de atenção e últimas atualizações */
.sf-duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;margin-top:34px}
.sf-painel{padding:18px 20px 8px}
.sf-painel > h3{font-size:max(12px,calc(15px * var(--fs)));font-weight:700;margin:0}
.sf-painel > .sub{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:3px 0 10px}
.sf-at{border-top:1px solid hsl(var(--border))}
.sf-at summary{display:flex;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;list-style:none;
  font-size:max(12px,calc(13.5px * var(--fs)));font-weight:600}
.sf-at summary::-webkit-details-marker{display:none}
.sf-at summary > .icon{width:16px;height:16px;color:hsl(var(--muted-foreground))}
.sf-at summary > span:not(.qt):not(.sf-sig){flex:1 1 auto;min-width:0}
.sf-at summary .qt{margin-left:auto;min-width:28px;text-align:center;font-size:max(12px,calc(12px * var(--fs)));font-weight:800;
  border-radius:999px;padding:2px 9px;background:hsl(var(--muted));color:hsl(var(--muted-foreground))}
.sf-at.tem summary .qt{background:hsl(var(--destructive)/.13);color:hsl(4 68% 40%)}
.sf-at.tem summary > .icon{color:hsl(var(--destructive))}
.sf-at.neutro summary .qt{background:hsl(var(--sefa-light-blue));color:hsl(var(--primary))}
.sf-at summary::after{content:"";flex:0 0 auto;width:7px;height:7px;margin:-4px 4px 0 2px;
  border-right:1.6px solid hsl(var(--muted-foreground));border-bottom:1.6px solid hsl(var(--muted-foreground));
  transform:rotate(45deg)}
.sf-at[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.sf-at-dica{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));margin:-4px 0 8px;line-height:1.5}
.sf-vazio{font-size:max(12px,calc(12.5px * var(--fs)));font-style:italic;color:hsl(var(--muted-foreground));margin:0 0 12px}

/* lista curta de ações, usada em vários blocos */
.sf-mini{list-style:none;margin:0 0 10px;padding:0}
.sf-mini li{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px dashed hsl(var(--border));
  font-size:max(12px,calc(13px * var(--fs)));min-width:0}
.sf-mini li:first-child{border-top:0}
.sf-mini .tit{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-mini .sf-sig,.sf-feed .sf-sig{min-width:0;height:22px;font-size:max(12px,calc(10.5px * var(--fs)));padding:0 7px;border-radius:6px}
.sf-mini .cod,.sf-feed .cod{font-size:max(12px,calc(10.5px * var(--fs)));padding:3px 7px;flex:0 0 auto}
.sf-mini-data{flex:0 0 auto;font-size:max(12px,calc(12px * var(--fs)));font-weight:600;color:hsl(var(--muted-foreground))}
.sf-ver{flex:0 0 auto;font-size:max(12px,calc(12px * var(--fs)));font-weight:700;color:hsl(var(--primary));padding:5px 9px;border-radius:7px;
  white-space:nowrap}
.sf-ver:hover{background:hsl(var(--sefa-light-blue))}
.sf-feed li{align-items:flex-start}
.sf-feed .quando{flex:0 0 74px;font-size:max(12px,calc(12px * var(--fs)));font-weight:700;line-height:1.35}
.sf-feed .quando em{display:block;font-style:normal;font-weight:500;color:hsl(var(--muted-foreground))}
.sf-feed .corpo{flex:1 1 auto;min-width:0}
.sf-feed .linha1{display:flex;gap:7px;align-items:center;min-width:0}
.sf-feed .linha1 .tit{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:600}
.sf-feed .mud{display:block;font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));margin-top:4px;line-height:1.45}

/* carteira de estudos */
.sf-cartoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:24px}
.sf-cartao{padding:20px 22px;display:flex;flex-direction:column;gap:13px;border-top:3px solid hsl(var(--primary))}
.sf-cartao-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sf-cartao h3{font-size:max(12px,calc(17px * var(--fs)));font-weight:800;margin:0;line-height:1.3;overflow-wrap:anywhere}
.sf-cartao .org{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:3px 0 0}
.sf-cartao .orc{font-size:max(12px,calc(12.5px * var(--fs)));line-height:1.5;margin:0}
.sf-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:12px 0;
  border-top:1px solid hsl(var(--border));border-bottom:1px solid hsl(var(--border))}
.sf-nums dt,.sf-datas dt{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:hsl(var(--muted-foreground))}
.sf-nums dd{margin:3px 0 0;font-size:max(12px,calc(22px * var(--fs)));font-weight:800;line-height:1.1}
.sf-datas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0}
.sf-datas dd{margin:3px 0 0;font-size:max(12px,calc(13.5px * var(--fs)));font-weight:600}
.sf-cartao > .btn-acao{align-self:flex-start;margin-top:auto}

/* detalhe do estudo */
.sf-det-cab{padding:18px 22px;margin-top:20px;display:flex;flex-direction:column;gap:14px}
.sf-det-cab .sf-datas{grid-template-columns:repeat(4,minmax(0,1fr))}
.sf-datas.sf-focal,.sf-det-cab .sf-datas.sf-focal{grid-template-columns:minmax(0,1fr)}
.sf-det-cab .btn-acao{align-self:flex-start}
.sf-sit{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.sf-sit > div{padding:14px 14px 13px}
.sf-sit .n{font-size:max(12px,calc(26px * var(--fs)));font-weight:800;line-height:1;margin-top:10px}
.sf-rec{margin-bottom:16px;border-top:3px solid hsl(var(--rec));overflow:hidden}
.sf-rec-cab{padding:16px 20px 14px}
.sf-rec-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sf-rec-cab h3{font-size:max(12px,calc(16px * var(--fs)));font-weight:700;margin:10px 0 0;line-height:1.35}
.sf-tab-cab,.sf-tab-lin{display:grid;
  grid-template-columns:48px minmax(0,1fr) 160px 92px 118px 40px 78px;gap:12px;align-items:center;padding:10px 20px}
.sf-tab-cab{padding-top:8px;padding-bottom:8px;background:hsl(var(--muted));
  font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.sf-tab-lin{border-top:1px solid hsl(var(--border));font-size:max(12px,calc(13px * var(--fs)))}
.sf-tab-lin .tit{min-width:0}
.sf-tab-lin .tit b{display:block;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.sf-tab-lin .tit em{display:block;font-style:normal;font-size:max(12px,calc(11.5px * var(--fs)));color:hsl(var(--muted-foreground));
  margin-top:3px;line-height:1.35}
.sf-tab-lin .sit{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.sf-tab-lin .pz{font-weight:600}
.sf-tab-lin .pz.late{color:hsl(4 68% 40%)}
.sf-tab-lin .kb-pg{margin-top:0}
.sf-tab-lin .ev{display:flex;align-items:center;gap:4px;font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.sf-tab-lin .ev .icon{width:13px;height:13px}
.sf-feito{padding:16px 20px;margin-bottom:12px;border-left:4px solid hsl(var(--status-success))}
.sf-feito-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sf-feito-topo .sf-ver{margin-left:auto}
.sf-feito h4{font-size:max(12px,calc(14.5px * var(--fs)));font-weight:700;margin:9px 0 0;line-height:1.35}
.sf-feito-prod{font-size:max(12px,calc(13px * var(--fs)));line-height:1.55;margin:6px 0 0}
.sf-feito-prod b{font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin-right:4px}

/* próximas entregas */
.sf-filtros{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;padding:15px 18px;margin:0 0 16px}
.sf-filtros .campo{flex:1 1 170px;min-width:0}
.sf-filtros .campo select,.sf-filtros .campo input{width:100%;min-width:0}
.sf-filtros .campo.busca{flex:2 1 230px}
.sf-res-resumo{margin:0 0 16px}
.sf-grupo{margin-bottom:24px}
.sf-grupo > h3{display:flex;align-items:center;gap:9px;margin:0 0 10px;
  font-size:max(12px,calc(11.5px * var(--fs)));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.sf-grupo > h3 .icon{width:15px;height:15px}
.sf-grupo > h3 .qt{font-size:max(12px,calc(11px * var(--fs)));font-weight:800;letter-spacing:0;border-radius:999px;padding:1px 9px;
  background:hsl(var(--card));border:1px solid hsl(var(--border));color:hsl(var(--foreground))}
.sf-grupo.g-atrasadas > h3{color:hsl(4 68% 40%)}
.sf-ent{display:flex;gap:16px;align-items:center;padding:14px 18px;margin-bottom:10px}
.sf-ent.late{border-left:4px solid hsl(var(--destructive))}
.sf-data{flex:0 0 66px;text-align:center;border-radius:10px;padding:9px 4px;
  background:hsl(var(--sefa-light-blue));color:hsl(var(--primary))}
.sf-data b{display:block;font-size:max(12px,calc(22px * var(--fs)));font-weight:800;line-height:1}
.sf-data span{display:block;font-size:max(12px,calc(10.5px * var(--fs)));font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.sf-ent.late .sf-data{background:hsl(var(--destructive)/.11);color:hsl(4 68% 40%)}
.sf-ent-corpo{flex:1 1 auto;min-width:0}
.sf-ent-topo{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sf-ent-topo .sf-sig{min-width:0;height:24px;font-size:max(12px,calc(10.5px * var(--fs)));padding:0 7px;border-radius:6px}
.sf-conta{font-size:max(12px,calc(12px * var(--fs)));font-weight:700;color:hsl(var(--muted-foreground))}
.sf-ent.late .sf-conta{color:hsl(4 68% 40%)}
.sf-ent h4{font-size:max(12px,calc(14px * var(--fs)));font-weight:700;margin:8px 0 3px;line-height:1.35;overflow-wrap:anywhere}
.sf-ent p{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));margin:0;line-height:1.4}
.sf-ent > .btn-acao{flex:0 0 auto}

/* calendário */
.sf-cal-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sf-cal-nav h3{font-size:max(12px,calc(17px * var(--fs)));font-weight:800;margin:0 4px;min-width:176px;text-align:center}
.sf-cal-nav .nav{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  background:hsl(var(--card));border:1px solid hsl(var(--border));color:hsl(var(--primary))}
.sf-cal-nav .nav:hover{background:hsl(var(--sefa-light-blue))}
.sf-cal-nav .nav .icon{width:16px;height:16px}
.sf-cal-nav .pl-resumo{margin-left:auto}
.sf-cal-aviso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;padding:11px 14px;
  border-radius:10px;background:hsl(var(--sefa-light-blue));font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--primary))}
.sf-cal-aviso .btn-acao{background:hsl(var(--card))}
.sf-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;overflow:hidden;
  background:hsl(var(--border));border:1px solid hsl(var(--border));border-radius:var(--radius)}
.sf-cal-sem{background:hsl(var(--muted));padding:8px 9px;
  font-size:max(12px,calc(10.5px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
.sf-cal-cel{background:hsl(var(--card));min-height:100px;padding:7px 6px 8px;display:flex;flex-direction:column;
  gap:4px;min-width:0}
.sf-cal-cel.fora{background:hsl(216 38% 97%)}
.sf-cal-cel .num{font-size:12px;font-weight:700;color:hsl(var(--muted-foreground));
  width:22px;height:22px;display:grid;place-items:center}
.sf-cal-cel.fora .num{color:hsl(215 16% 72%)}
.sf-cal-cel.hoje .num{color:#fff;background:hsl(var(--primary));border-radius:999px}
.sf-chip{display:block;width:100%;text-align:left;font-size:max(12px,calc(11px * var(--fs)));font-weight:700;padding:3px 6px;border-radius:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid}
.sf-chip:hover{filter:brightness(.95)}
.sf-chip em{font-style:normal;font-weight:500;margin-left:5px}
.c-nao_iniciada{background:hsl(194 85% 38%/.11);border-color:hsl(var(--status-info));color:hsl(194 80% 25%)}
.c-em_execucao{background:hsl(var(--status-warning)/.17);border-color:hsl(var(--status-warning));color:hsl(38 84% 27%)}
.c-aguardando{background:hsl(215 18% 43%/.12);border-color:hsl(215 18% 55%);color:hsl(215 20% 30%)}
.c-atrasada{background:hsl(var(--destructive)/.12);border-color:hsl(var(--destructive));color:hsl(4 68% 37%)}
.sf-leg .c-nao_iniciada,.sf-leg .c-em_execucao,.sf-leg .c-aguardando,.sf-leg .c-atrasada{border-left-width:3px;
  border-left-style:solid}
.sf-agenda{display:none}
.sf-ag-dia{font-size:max(12px,calc(12px * var(--fs)));font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:hsl(var(--muted-foreground));margin:16px 0 4px}
.sf-ag-dia:first-child{margin-top:0}
.sf-nota-cal{font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));margin:14px 2px 0;line-height:1.5}

/* arquivados e apagados */
.cfg-abas button .qt{margin-left:7px;font-size:max(12px,calc(11px * var(--fs)));font-weight:800;border-radius:999px;padding:1px 7px;
  background:hsl(var(--foreground)/.1)}
.cfg-abas button.active .qt{background:hsl(0 0% 100%/.25)}
.cfg-aviso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:11px 14px;
  border-radius:10px;background:hsl(var(--status-success)/.1);border:1px solid hsl(var(--status-success)/.35);
  font-size:max(12px,calc(13px * var(--fs)));color:hsl(147 68% 22%)}
.cfg-aviso > .icon{width:16px;height:16px;flex:0 0 auto}
.cfg-aviso > span{flex:1 1 240px;min-width:0}
.cfg-aviso .btn-acao{background:hsl(var(--card))}
.btn-acao.perigo{color:hsl(4 68% 40%);background:hsl(var(--destructive)/.1)}
.btn-acao.perigo:hover{background:hsl(var(--destructive));color:#fff}
.btn-perigo{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;
  font-size:max(12px,calc(13.5px * var(--fs)));font-weight:700;background:hsl(var(--destructive));color:#fff}
.btn-perigo:hover{background:hsl(4 65% 46%)}
.btn-perigo .icon{width:15px;height:15px}
.mo-perigo{display:flex;gap:10px;align-items:flex-start;margin:0;padding:13px 15px;border-radius:10px;
  background:hsl(var(--destructive)/.08);border-left:3px solid hsl(var(--destructive));
  font-size:max(12px,calc(13.5px * var(--fs)));line-height:1.55}
.mo-perigo .icon{width:17px;height:17px;flex:0 0 auto;margin-top:2px;color:hsl(var(--destructive))}
.mo-caixa.mo-pequena{max-width:560px}
/* historico com escolha da acao */
.mo-caixa.mo-larga{max-width:1080px}
.mo-corpo.hs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start;padding-top:18px}
.hs-lista{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;
  max-height:calc(100vh - 230px);overflow-y:auto;padding-right:4px}
.hs-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;
  padding:9px 10px;border-radius:9px;text-align:left;border:1px solid transparent;
  font-size:max(12px,calc(12.5px * var(--fs)));line-height:1.3;color:hsl(var(--foreground))}
.hs-opt:hover{background:hsl(var(--muted))}
.hs-opt.active{background:hsl(var(--sefa-light-blue));border-color:hsl(var(--primary)/.35)}
.hs-opt .cod{font-size:max(12px,calc(10.5px * var(--fs)));padding:2px 7px}
.hs-opt .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.hs-opt.semcod{grid-template-columns:minmax(0,1fr) auto}
.hs-opt.todas{grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid hsl(var(--border));border-radius:9px 9px 0 0;margin-bottom:4px}
.hs-opt .qt{min-width:24px;text-align:center;font-size:max(12px,calc(11px * var(--fs)));font-weight:800;
  border-radius:999px;padding:1px 7px;background:hsl(var(--foreground)/.08)}
.hs-opt.active .qt{background:hsl(var(--primary));color:#fff}
.hs-opt.vazia .t{color:hsl(var(--muted-foreground));font-weight:500}
.hs-reg{min-width:0}
.hs-tit{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:max(12px,calc(14px * var(--fs)));
  font-weight:700;line-height:1.35}
@media (max-width:720px){
  .mo-corpo.hs{grid-template-columns:1fr}
  .hs-lista{position:static;max-height:220px;border-bottom:1px solid hsl(var(--border));padding-bottom:10px}
}
.mo-fixo{margin:0;padding:9px 0;font-size:max(12px,calc(13.5px * var(--fs)));font-weight:600}
.mo-erro{margin:10px 0 0;padding:9px 12px;border-radius:8px;font-size:max(12px,calc(13px * var(--fs)));font-weight:600;
  color:hsl(var(--destructive));background:hsl(var(--destructive)/.09)}
.obrig{font-style:normal;font-weight:400;color:hsl(var(--muted-foreground))}
.niveis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nivel{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid hsl(var(--border));
  border-radius:10px;cursor:pointer}
.nivel:has(input:checked){border-color:hsl(var(--primary));background:hsl(var(--sefa-light-blue)/.5)}
.nivel input{margin-top:3px}
.nivel b{display:block;font-size:max(12px,calc(14px * var(--fs)))}
.nivel small{display:block;margin-top:3px;font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground));line-height:1.45}
.acesso-org{padding:10px 0;border-top:1px solid hsl(var(--border))}
.acesso-org:first-of-type{border-top:0}
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:max(12px,calc(13.5px * var(--fs)));line-height:1.4}
.chk input{margin-top:3px;flex:none}
.chk input:disabled + span{color:hsl(var(--muted-foreground))}
.acesso-est{display:flex;flex-direction:column;gap:6px;margin:8px 0 0 26px}
.acesso-unico{margin:4px 0 0 26px;font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
@media (max-width:640px){ .niveis{grid-template-columns:1fr} }
.mo-alvo{margin:0 0 12px;font-size:max(12px,calc(14px * var(--fs)));line-height:1.5}
.mo-alvo b{display:inline-block;margin-right:6px;font-size:max(12px,calc(11.5px * var(--fs)));font-weight:800;
  color:hsl(var(--primary));background:hsl(var(--sefa-light-blue));border-radius:6px;padding:2px 8px}
.mo-aviso > span{min-width:0}
.badge.b-arquivado{color:hsl(262 45% 42%);background:hsl(262 60% 52%/.12)}
.cfg-item.is-arquivado{border-left-color:hsl(262 50% 60%)}
.cfg-item.is-apagado{border-left-color:hsl(var(--destructive)/.6)}
.sf-arq-nota{margin-top:20px}
.acoes-arq{margin-top:22px;padding:18px 22px}
.acoes-arq h3{display:flex;align-items:center;gap:8px;margin:0;font-size:max(12px,calc(15px * var(--fs)));color:hsl(262 45% 42%)}
.acoes-arq h3 svg{width:17px;height:17px}
.acoes-arq .sub{margin:4px 0 10px;font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.acoes-arq ul{list-style:none;margin:0;padding:0}
.acoes-arq li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid hsl(var(--border));
  font-size:max(12px,calc(13.5px * var(--fs)))}
.acoes-arq .cod{font-weight:800;color:hsl(var(--muted-foreground));min-width:38px}
.acoes-arq .tit{flex:1;min-width:0}
.acoes-arq .quando{font-size:max(12px,calc(12px * var(--fs)));color:hsl(var(--muted-foreground));white-space:nowrap}
.sf-arq-acoes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 20px 16px;
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.sf-arq-acoes svg{width:15px;height:15px;color:hsl(262 45% 42%)}
@media (max-width:640px){ .acoes-arq li{flex-wrap:wrap} }

/* ficha da ação em consulta */
.sf-ficha .acao-top{margin:16px 0 0}
.sf-ficha .desc{font-size:max(12px,calc(14px * var(--fs)));line-height:1.62;margin:10px 0 0;white-space:pre-line}
.sf-so-leitura{display:flex;align-items:center;gap:7px;margin-right:auto;
  font-size:max(12px,calc(12.5px * var(--fs)));color:hsl(var(--muted-foreground))}
.sf-so-leitura .icon{width:14px;height:14px;color:hsl(var(--primary))}

@media (max-width:1080px){
  .sf-est-linha{grid-template-columns:56px minmax(0,1fr) 18px;row-gap:10px}
  .sf-est-linha .sf-sinais,.sf-est-linha .sf-dados{grid-column:2}
  .sf-est-linha .sf-seta{grid-column:3;grid-row:1}
  .sf-sit{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:980px){
  .sf-duas{grid-template-columns:1fr}
}
@media (max-width:900px){
  .sf-tab-cab{display:none}
  .sf-tab-lin{grid-template-columns:48px minmax(0,1fr);row-gap:8px}
  .sf-tab-lin > :nth-child(n+3){grid-column:2}
  .sf-tab-lin [data-rot]{display:flex;align-items:center;gap:10px}
  .sf-tab-lin [data-rot]::before{content:attr(data-rot);flex:0 0 84px;
    font-size:max(12px,calc(10px * var(--fs)));font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:hsl(var(--muted-foreground))}
  .sf-tab-lin .sit{flex-direction:row;flex-wrap:wrap}
  .sf-tab-lin .kb-pg{flex:1 1 auto}
  .sf-tab-lin .sf-ver{justify-self:start}
}
@media (max-width:860px){
  .sf-cartoes{grid-template-columns:1fr}
  .sf-det-cab .sf-datas{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .sf-cal,.sf-cal-leg{display:none}
  .sf-agenda{display:block}
}
@media (max-width:640px){
  .sf .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .sf .st{padding:16px 15px 15px;gap:11px}
  .sf .st .n{font-size:max(12px,calc(26px * var(--fs)))}
  .sf-sit{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sf-ent{flex-wrap:wrap;padding:14px}
  .sf-ent > .btn-acao{margin-left:82px}
  .sf-dados{grid-template-columns:1fr 1fr}
  .sf-cal-nav h3{min-width:0;flex:1 1 auto}
  .sf-cal-nav .pl-resumo{margin-left:0;width:100%}
  .sf-mini-data{display:none}
}
@media (max-width:380px){
  .sf .grid-4{grid-template-columns:1fr}
}

/* Tamanho do texto. --fs multiplica todas as fontes do sistema, com piso de
   12px; ficam de fora so os circulos de tamanho fixo (siglas, avatar, dia do
   calendario), e o nome no cartao de acesso para no tamanho padrao, porque
   o cartao e estreito e maior que isso quebraria a palavra. A pessoa escolhe na barra superior e a escolha fica no
   navegador dela. Abaixo de 640px os tres botoes viram um so, que alterna. */
:root{--fs:1.15}
:root[data-texto="grande"]{--fs:1.3}
:root[data-texto="maior"]{--fs:1.5}
.tb-texto{display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:hsl(var(--muted))}
.tb-texto button{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;
  font-weight:700;line-height:1;color:hsl(var(--muted-foreground))}
.tb-texto button:hover{color:hsl(var(--primary))}
.tb-texto button[aria-pressed="true"]{background:hsl(var(--card));color:hsl(var(--primary));
  box-shadow:0 1px 3px hsl(var(--foreground) / .14)}
.tb-texto .t1{font-size:13px}
.tb-texto .t2{font-size:16px}
.tb-texto .t3{font-size:19px}
.tb-texto-ciclo{display:none;width:40px;height:40px;border-radius:999px;place-items:center;
  background:hsl(var(--muted));color:hsl(var(--primary));font-size:15px;font-weight:800}
.topbar > div:not(.tb-right){min-width:0}
.tb-eyebrow,.tb-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){
  .tb-texto{display:none}
  .tb-texto-ciclo{display:grid}
}
</style>
</head>
